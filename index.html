<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D5A43">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Revierbuch"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Revierbuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen field app. Slim header, four views (Karte, Einträge, Statistik, Daten) and a bottom tab bar.
   The map bleeds edge to edge; every other surface keeps the side gutter. Palette is forest signage: green-tinted
   neutrals, one forest-green accent, one marker colour per facility type, red reserved for harvests. */
:root{
  --bg:#EDEFE8; --surface:#F8F9F4; --ink:#19231D; --ink-2:#55615A; --line:#CBD1C5;
  --accent:#2D5A43; --accent-ink:#FFFFFF; --map:#E3E8DC; --grid:#D3DACB; --on-mark:#FFFFFF;
  --kanzel:#2D5A43; --bock:#2F5F86; --huette:#7A5A34; --futter:#B07A1E; --kirrung:#A4502F;
  --salz:#5B6B73; --acker:#6F7A25; --sonst:#6B746E; --posten:#8A2F5B; --sicht:#2E8B3E; --kill:#B3261E;
  --warn:#7A4E00; --warn-bg:#F4E5BF; --shadow:0 6px 24px rgba(20,30,24,.18);
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101612; --surface:#18211B; --ink:#E4EADF; --ink-2:#9BA89F; --line:#2E3B32;
  --accent:#7FC29A; --accent-ink:#0E1A12; --map:#0C120F; --grid:#18231C; --on-mark:#0E1A12;
  --kanzel:#7FC29A; --bock:#7FB3DB; --huette:#D2AE82; --futter:#E0AE55; --kirrung:#E58F6C;
  --salz:#9DB0BA; --acker:#BCC864; --sonst:#9AA59E; --posten:#E08AB4; --sicht:#8CD97A; --kill:#F2837B;
  --warn:#F0CF86; --warn-bg:#3A2F12; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#18211B; --ink:#E4EADF; --ink-2:#9BA89F; --line:#2E3B32;
  --accent:#7FC29A; --accent-ink:#0E1A12; --map:#0C120F; --grid:#18231C; --on-mark:#0E1A12;
  --kanzel:#7FC29A; --bock:#7FB3DB; --huette:#D2AE82; --futter:#E0AE55; --kirrung:#E58F6C;
  --salz:#9DB0BA; --acker:#BCC864; --sonst:#9AA59E; --posten:#E08AB4; --sicht:#8CD97A; --kill:#F2837B;
  --warn:#F0CF86; --warn-bg:#3A2F12; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-body);-webkit-text-size-adjust:100%;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gx{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#app{height:100%;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding-block:8px;background:var(--surface);border-bottom:1px solid var(--line);min-height:52px}
.brand{min-width:0;flex:1}
.brand h1{margin:0;font:700 22px/1 var(--font-display);letter-spacing:.09em;text-transform:uppercase}
.brand small{display:block;color:var(--ink-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.status{display:flex;gap:6px;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;background:var(--bg);color:var(--ink-2);min-height:28px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ink-2)}
.pill.ok i{background:var(--accent)} .pill.busy i{background:var(--futter)} .pill.bad i{background:var(--kill)}
button.pill{cursor:pointer}

.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
#viewMap{overflow:hidden;background:var(--map)}
#map{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.pad{padding-block:16px 28px;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;min-height:56px;color:var(--ink-2);font:600 12px/1 var(--font-display);letter-spacing:.07em;text-transform:uppercase;border-top:3px solid transparent}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}

/* map overlays */
.layers{position:absolute;top:10px;left:0;right:0;display:flex;gap:6px;overflow-x:auto;padding-block:2px;scrollbar-width:none}
.layers::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;min-height:34px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.chip i{width:10px;height:10px;border-radius:3px;background:var(--c,var(--ink-2))}
.chip[aria-pressed="false"]{color:var(--ink-2);background:var(--bg)} .chip[aria-pressed="false"] i{opacity:.35}
.demo{position:absolute;top:54px;left:0;right:0;display:flex;align-items:center;gap:10px}
.demo div{flex:1;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.demo button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:4px;min-height:32px}
.maptools{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;display:flex;flex-direction:column;gap:8px}
.rb{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);padding:0}
.rb svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.rb.on svg{stroke:var(--accent)}
.fab{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:0 22px 0 16px;height:50px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);font:700 17px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase}
.fab svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.scale{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:78px;font:500 11px/1 var(--font-mono);color:var(--ink);pointer-events:none}
.scale b{display:block;height:6px;border:2px solid var(--ink);border-top:0;margin-top:3px}
.place{position:absolute;top:0;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.place p{margin:0;font-size:14px}
.place code{font:500 13px var(--font-mono);color:var(--ink-2)}

/* buttons, fields */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 16px;min-height:46px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--kill);border-color:currentColor}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font:600 13px/1 var(--font-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
input[type=text],input[type=number],input[type=search],input[type=datetime-local],select,textarea{width:100%;min-height:46px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;min-width:0}
textarea{resize:vertical}
input.mono{font-family:var(--font-mono);letter-spacing:.04em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:84px;border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:44px;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.type{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;min-height:46px;text-align:left;font-size:14px}
.type i,.mk{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--on-mark);font:700 13px/1 var(--font-display);font-style:normal}
.type[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}
.posrow{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.posrow code{font:500 14px var(--font-mono)}
.hint{font-size:13px;color:var(--ink-2);margin:0}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px}

/* sheet */
#ov{position:fixed;inset:0;background:rgba(10,16,12,.5);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:90%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding-top:8px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
#sheet:focus{outline:0}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:44px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sbody{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sbody h2{margin:0;font:700 24px/1.1 var(--font-display);letter-spacing:.05em;text-transform:uppercase}
.choice{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;min-height:64px;text-align:left;width:100%}
.choice b{display:block;font-size:16px} .choice small{color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv code{font-family:var(--font-mono)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:min(92vw,520px);text-align:center;box-shadow:var(--shadow)}

/* lists */
h2.sec{margin:0;font:700 20px/1 var(--font-display);letter-spacing:.07em;text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar .btn{flex:1}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:60px}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .rt b{overflow-wrap:anywhere}
.row small{color:var(--ink-2);font-size:13px}
.tagc{font:500 12px var(--font-mono);border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--bg);flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.mk.sq{border-radius:8px}
.empty{color:var(--ink-2);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:12px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .bt{height:14px;border-radius:4px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar .bt i{display:block;height:100%;background:var(--accent)}
.bar .bv{font:500 13px var(--font-mono);text-align:right;white-space:nowrap}
.bar .bl{overflow-wrap:anywhere}
.bar small{display:block;color:var(--ink-2);font-size:12px}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:150px;padding-top:6px}
.months div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font:500 10px var(--font-mono);color:var(--ink-2);min-width:0}
.months i{display:block;width:100%;background:var(--kill);border-radius:3px 3px 0 0;min-height:2px}
.months em{font-style:normal;color:var(--ink)}
.big{font:700 56px/1 var(--font-display);letter-spacing:.02em}
.lotrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.lotrow span{flex:1;min-width:120px;overflow-wrap:anywhere}
.pick{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px}
.pick label{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;min-height:44px}
.pick input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
a{color:var(--accent)}
.attr{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:100px;max-width:60%;font:400 10px/1.3 var(--font-body);color:var(--ink);background:color-mix(in srgb,var(--surface) 78%,transparent);padding:2px 6px;border-radius:4px;pointer-events:none}
.attr:empty{display:none}
#tabs button{min-width:0;overflow:hidden;font-size:clamp(7px,2.2vw,12px)!important;letter-spacing:.01em!important;padding-inline:1px!important}
.guide{position:absolute;top:0;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;box-shadow:var(--shadow);z-index:3}
.garrow{width:64px;height:64px;flex:none;transition:transform .12s linear}
.gtext{display:flex;flex-direction:column;gap:2px;flex:1;min-width:130px}
.gtext b{overflow-wrap:anywhere}
.gdist{font:700 34px/1 var(--font-display);letter-spacing:.03em}
.gbtn{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.phs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.phw{position:relative}
.ph{width:84px;height:84px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);cursor:pointer}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.phx{position:absolute;top:3px;right:3px;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:26px;cursor:pointer}
.pick{display:flex;align-items:center;gap:10px;cursor:pointer}.pick input{width:22px;height:22px;flex:none}
.plrow{display:grid;grid-template-columns:1.3fr 1fr .7fr auto;gap:6px;align-items:start}
.sw{display:flex;flex-wrap:wrap;gap:8px}.swb{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}.swb.auto{width:auto;border-radius:18px;padding:0 12px;background:var(--surface);color:var(--ink);font:600 13px/1 inherit}.swb.dot{width:20px;height:20px}.swb[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.tabs button{letter-spacing:.03em!important;padding-inline:2px!important}
a.btn{text-decoration:none;color:var(--ink)}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
</style>

</head>
<body>
<div id="app">
  <header class="top gx">
    <div class="brand"><h1>Revierbuch</h1><small id="lotName">Kein Los gewählt</small></div>
    <div class="status"><button class="pill" id="stStore" type="button" data-accopen aria-label="Konto und Gruppen"><i></i><span>Lade …</span></button><button class="pill" id="stGps" type="button" aria-label="Standort"><i></i><span>GPS aus</span></button></div>
  </header>
  <div class="views">
    <section class="view" id="viewMap">
      <canvas id="map" aria-label="Revierkarte"></canvas>
      <div class="layers gx" id="layers"></div>
      <div class="demo gx" id="demo" hidden><div><span>Beispieldaten sind sichtbar. Sie verschwinden mit deinem ersten Eintrag.</span><button type="button" id="demoOff">Ausblenden</button></div></div>
      <div class="attr" id="attr"></div>
      <div class="scale" id="scale"><span id="scaleL"></span><b id="scaleB"></b></div>
      <div class="maptools">
        <button class="rb" id="bFit" type="button" aria-label="Zu meinem Los"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="rb" id="bLoc" type="button" aria-label="Mein Standort"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
        <button class="rb" id="bIn" type="button" aria-label="Hineinzoomen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="rb" id="bOut" type="button" aria-label="Herauszoomen"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      </div>
      <button class="fab" id="fab" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Eintragen</button>
      <div class="guide gx" id="guide" hidden>
        <svg id="gArrow" class="garrow" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M32 7 L47 46 L32 38 L17 46 Z" fill="var(--accent)"/></svg>
        <div class="gtext"><b id="gName"></b><span class="gdist" id="gDist">…</span><span class="hint" id="gSub"></span></div>
        <div class="gbtn"><a class="btn sm" id="gCar" target="_blank" rel="noopener">Route Auto</a><a class="btn sm" id="gWalk" target="_blank" rel="noopener">Route zu Fuß</a><button class="btn sm danger" id="gEnd" type="button">Beenden</button></div>
      </div>
      <div class="place gx" id="place" hidden>
        <p><b id="placeTitle">Position wählen</b><br><span class="hint">Karte verschieben, bis das Fadenkreuz auf dem Ort liegt.</span></p>
        <code id="pcoord"></code>
        <div class="btnrow"><button class="btn primary sm" id="pOk" type="button">Hier setzen</button><button class="btn sm" id="pGps" type="button">Mein Standort</button><button class="btn sm" id="pNo" type="button">Abbrechen</button></div>
      </div>
    </section>
    <section class="view" id="viewStart" hidden><div class="pad gx" id="startBody"></div></section>
    <section class="view" id="viewLog" hidden><div class="pad gx" id="logBody"></div></section>
    <section class="view" id="viewHunt" hidden><div class="pad gx" id="huntBody"></div></section>
    <section class="view" id="viewStats" hidden><div class="pad gx" id="statsBody"></div></section>
    <section class="view" id="viewGroups" hidden><div class="pad gx" id="groupsBody"></div></section>
    <section class="view" id="viewData" hidden><div class="pad gx" id="dataBody"></div></section>
  </div>
  <nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
</div>
<div id="ov" hidden></div>
<section id="sheet" class="gx" role="dialog" aria-modal="true" tabindex="-1" hidden><div class="grab"></div><div class="sbody" id="sheetBody"></div></section>
<div id="toast" role="status" hidden></div>
<input type="file" id="fileIn" accept=".geojson,.json,.kml,application/json,application/geo+json,application/vnd.google-earth.kml+xml" hidden>

<script>

:"Les données sont stockées chez Supabase. La base de données se trouve à Francfort-sur-le-Main (UE). Aucune transmission à des fins publicitaires n'a lieu.","Du hast das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit und Widerspruch. Wende dich dazu an die oben genannte Kontaktadresse. Du kannst dich außerdem bei der zuständigen Aufsichtsbehörde beschweren, in Luxemburg ist das die Commission nationale pour la protection des données (CNPD, cnpd.lu).":"Tu as le droit d'accès, de rectification, d'effacement, de limitation du traitement, à la portabilité des données et d'opposition. Adresse-toi pour cela à l'adresse de contact indiquée ci-dessus. Tu peux aussi introduire une réclamation auprès de l'autorité de contrôle compétente ; au Luxembourg, il s'agit de la Commission nationale pour la protection des données (CNPD, cnpd.lu).","Revierkarte":"Carte du territoire","Standort":"Position","Zu meinem Los":"Vers mon lot","Beenden":"Terminer","Herauszoomen":"Dézoomer","Hineinzoomen":"Zoomer","Karte verschieben, bis das Fadenkreuz auf dem Ort liegt.":"Déplace la carte jusqu'à ce que le réticule soit sur le lieu.","Position wählen":"Choisir la position","♂ männlich":"♂ mâle","Quelle: Arrêté ministériel du 20 mars 2024 (Mémorial B n° 1267). Gezählt werden nur Abschüsse, die in der Zeit":"Source : Arrêté ministériel du 20 mars 2024 (Mémorial B n° 1267). Seuls les tirs réalisés pendant la période","Quelle: Tableau synoptique de l’ouverture de la chasse 2026/2027 (Ministère de l’Environnement, du Climat et de la Biodiversité). Prüfe im Zweifel die amtliche Fassung.":"Source : Tableau synoptique de l’ouverture de la chasse 2026/2027 (Ministère de l’Environnement, du Climat et de la Biodiversité). En cas de doute, vérifie la version officielle.","Sprache":"Langue","Sprache der Oberfläche. Eingetragene Daten und Namen bleiben unverändert.":"Langue de l'interface. Les données et noms saisis restent inchangés.","Wähle unter „Daten“ deine Jagdlose aus, dann erscheint hier der amtliche Plan de tir {n} dafür.":"Choisis tes lots de chasse sous « Données » ; le plan de tir officiel {n} apparaîtra ici.","Ø {n} kg aufgebrochen":"Ø {n} kg éviscéré","Noch kein Plan für {n}. Trage ein, wie viele Stücke je Wildart geplant sind, dann siehst du hier, wie weit du bist.":"Pas encore de plan pour {n}. Saisis combien de pièces sont prévues par espèce et tu verras ici où tu en es.","Gezählt werden die Abschüsse im Kalenderjahr {n} (wähle oben ein Jahr für ein anderes Jahr).":"Les tirs sont comptés sur l'année civile {n} (choisis une année en haut pour une autre année).","Abschüsse als CSV":"Tirs en CSV","Abschüsse und Sichtungen":"Tirs et observations","Sicherung (JSON)":"Sauvegarde (JSON)","Nur Abschüsse":"Tirs uniquement","Nur Sichtungen":"Observations uniquement","unbekannt":"inconnu","weiblich":"femelle","gemischt":"mixte","Mit einem Konto kannst du Gruppen anlegen oder einer Gruppe beitreten und Einträge mit anderen Jägern deines Loses teilen.":"Avec un compte, tu peux créer des groupes ou en rejoindre un et partager des entrées avec d'autres chasseurs de ton lot.","@tab Statistik":"Stats","@tab Einträge":"Entrées","Willkommen im Revierbuch":"Bienvenue dans le Revierbuch","Dein Jagdbuch für die Hosentasche: Karte, Abschüsse, Sichtungen, Ansitze und Statistik, auch ohne Netz im Wald. Die Einführung dauert eine Minute. Die Sprache stellst du unter „Daten“ ein.":"Ton carnet de chasse de poche : carte, tirs, observations, affûts et statistiques, même sans réseau en forêt. L'introduction dure une minute. La langue se règle sous « Données ».","Karte und Lose":"Carte et lots","Alle Jagdlose Luxemburgs sind auf der Karte. Tippe auf dein Los, um es als dein Los zu markieren, oder gib die Nummer unter „Daten“ ein. Rechts findest du Zoom, deinen Standort und die Legende zum Ein- und Ausblenden.":"Tous les lots de chasse du Luxembourg sont sur la carte. Touche ton lot pour le marquer comme le tien ou saisis son numéro sous « Données ». À droite, tu trouves le zoom, ta position et la légende pour afficher et masquer.","Mit dem Knopf „Eintragen“ legst du Abschüsse, Wildsichtungen, Kanzeln und andere Einrichtungen, Flächen und Tracks an. Tipp: Auf der Karte lange drücken, um direkt an dieser Stelle etwas einzutragen.":"Avec le bouton « Ajouter », tu crées des tirs, des observations de gibier, des miradors et autres installations, des surfaces et des traces. Astuce : appuie longuement sur la carte pour y saisir directement quelque chose.","Abschüsse und Wildmarken":"Tirs et marques de gibier","Beim Abschuss trägst du Wildart, Geschlecht, Gewicht und Wildmarke ein. Die App prüft die Jagdzeiten, warnt vor Schonzeiten und erinnert an die Meldung bei der Naturverwaltung. Unklare Treffer legen eine offene Nachsuche an.":"Pour un tir, tu saisis l'espèce, le sexe, le poids et la marque de gibier. L'app vérifie les périodes de chasse, avertit en cas de période de protection et rappelle la déclaration à l'Administration de la nature. Les tirs incertains créent une recherche ouverte.","Ansitze und Drückjagden":"Affûts et battues","Reserviere Kanzeln für einen Ansitz, damit sich niemand in die Quere kommt. Für eine Drückjagd legst du Posten an, wählst sie aus und trägst die Schützen ein. Unter „Jagd“ siehst du alles auf einen Blick.":"Réserve des miradors pour un affût afin que personne ne se gêne. Pour une battue, tu crées des postes, tu les choisis et tu saisis les tireurs. Sous « Chasse », tu vois tout en un coup d'œil.","Statistik und Abschussplan":"Statistiques et plan de tir","Die Statistik zeigt Abschüsse nach Wildart, Kanzel und Monat. Mit dem Plan de tir deiner Lose siehst du, wie weit du bist. Wildschäden erfasst du mit Fläche, Preis pro ar und Jahresvergleich.":"Les statistiques montrent les tirs par espèce, mirador et mois. Avec le plan de tir de tes lots, tu vois où tu en es. Les dégâts de gibier sont saisis avec la surface, le prix par are et une comparaison annuelle.","Gruppen und Konto":"Groupes et compte","Ein Konto ist freiwillig. Damit legst du Gruppen für dein Los an, lädst Mitjäger per Code ein und vergibst Rollen. Ohne Konto bleibt alles nur auf deinem Gerät, erstelle dann regelmäßig eine Sicherung unter „Daten“.":"Un compte est facultatif. Avec lui, tu crées des groupes pour ton lot, invites des co-chasseurs par code et attribues des rôles. Sans compte, tout reste uniquement sur ton appareil ; crée alors régulièrement une sauvegarde sous « Données ».","iPhone: In Safari auf „Teilen“ tippen, dann „Zum Home-Bildschirm“. Android: In Chrome das Menü öffnen, dann „App installieren“. Die Reiter unten kannst du lang drücken, um sie zu verschieben oder auszublenden.":"iPhone : dans Safari, touche « Partager », puis « Sur l'écran d'accueil ». Android : dans Chrome, ouvre le menu, puis « Installer l'application ». Tu peux appuyer longuement sur les onglets en bas pour les déplacer ou les masquer.","Überspringen":"Passer","Los geht’s":"C'est parti","Einführung":"Introduction","Eine kurze Tour durch die wichtigsten Funktionen.":"Une courte visite des fonctions principales.","Einführung ansehen":"Voir l'introduction"},"lb":{"(freie Lizenz). Für die App in WGS 84 umgerechnet und auf etwa einen Meter vereinfacht.":"(fräi Lizenz). Fir d'App op WGS 84 ëmgerechent a ronn op ongeféier ee Meter vereinfacht.","(in der App unter Daten > Konto und Gruppen > Einladung einlösen).":"(an der App ënner Daten > Kont a Gruppen > Invitatioun ariichten).","(mindestens 8 Zeichen)":"(mindestens 8 Zeechen)","(unterbrochen)":"(ënnerbrach)","(wähle oben ein Jahr für ein anderes Jahr)":"(wiel uewen e Joer fir en anert Joer)","+ Abschuss":"+ Ofschoss","+ Ansitz reservieren":"+ Hochsitz reservéieren","+ Fläche":"+ Fläch","+ Fläche einzeichnen":"+ Fläch zeechnen","+ Gruppe":"+ Grupp","+ Gruppe erstellen":"+ Grupp erstellen","+ Kennzahl":"+ Kennzuel","+ Linie":"+ Linn","+ Neue Drückjagd":"+ Nei Klappjuegd","+ Neue Fläche":"+ Nei Fläch","+ Schaden eintragen":"+ Schued androe n“ oder wiel eng aner Kaart.","Die Lose sind noch nicht geladen.":"D'Lous sinn nach net gelueden.","Diese E-Mail ist bereits registriert.":"Dës E-Mail ass schonn registréiert.","Diese Wildmarke ist bereits bei einem anderen Abschuss eingetragen.":"Dës Wëldmark ass schonn bei engem anere Ofschoss ageschriwwen.","Dieser Browser kann keine Karten speichern.":"Dëse Browser ka keng Kaarten späicheren.","Dieses Jagdjahr (ab 1.4.)":"Dëst Juegdjoer (ab 1.4.)","Dieses Jahr":"Dëst Joer","Drückjagd":"Klappjuegd","Drückjagd bearbeiten":"Klappjuegd änneren","Drückjagdbock 1":"Klappjuegdbock 1","Drückjagdbock 2":"Klappjuegdbock 2","Drückjagden":"Klappjuegten","Drückjagdposten":"Klappjuegdposten","Du bist Administrator dieser Gruppe.":"Du bass Administrateur vun dëser Grupp.","Du bist jetzt in der Gruppe.":"Du bass elo an der Grupp.","Du bist noch in keiner Gruppe.":"Du bass nach an enger Grupp.","Du hast noch kein Los gewählt. Gib die Losnummer unten ein.":"Du hues nach kee Lous gewielt. Gëff d'Lousnummer ënnendrënner an.","E-Mail oder Passwort stimmt nicht.":"E-Mail oder Passwuert stëmmt net.","Eichenkultur":"Eechekultur","Eigene Grenzen einlesen":"Eegen Grenzen ariichten","Ein Konto ist freiwillig. Ohne Konto bleibt dein Revierbuch wie bisher nur auf diesem Gerät. Mit Konto kannst du später Einträge mit anderen Jägern deines Loses teilen. Es wird nichts automatisch hochgeladen.":"E Kont ass fräiwëlleg. Ouni Kont bleift däi Revéierbuch wéi bis elo nëmmen op dësem Apparat. Mat engem Kont kanns du spéider Androungen mat anere Jäger vun dengem Lous deelen. Et gëtt näischt automatesch eropgelueden.","Ein Los gehört zuerst der Gruppe, die es als erste einträgt. Fordert eine weitere Gruppe dasselbe Los an, muss ein Administrator der ersten Gruppe zustimmen. Es werden automatisch die Rollen „Jäger“ und „Gast“ angelegt, die du danach anpassen kannst.":"E Lous gehéiert fir d'éischt der Grupp, déi en als éischt aschreift. Freet eng weider Grupp datselwecht Lous un, muss een Administrateur u synoptique de l’ouverture de la chasse 2026/2027 (Ministère de l’Environnement, du Climat et de la Biodiversité). Kontrolléier am Zweiwelsfall déi amtlech Fassung.","Sprache":"Sprooch","Sprache der Oberfläche. Eingetragene Daten und Namen bleiben unverändert.":"Sprooch vun der Uewerfläch. Agedroen Daten an Nimm bleiwen onverännert.","Wähle unter „Daten“ deine Jagdlose aus, dann erscheint hier der amtliche Plan de tir {n} dafür.":"Wiel ënner „Daten“ deng Juegdlous aus, dann erschéngt hei den amtlechen Plan de tir {n} dofir.","Ø {n} kg aufgebrochen":"Ø {n} kg opgebrach","Noch kein Plan für {n}. Trage ein, wie viele Stücke je Wildart geplant sind, dann siehst du hier, wie weit du bist.":"Nach kee Plang fir {n}. Gëff an, wéi vill Stécker pro Wëldaart geplangt sinn, dann gesäis du hei, wéi wäit du bass.","Gezählt werden die Abschüsse im Kalenderjahr {n} (wähle oben ein Jahr für ein anderes Jahr).":"Gezielt ginn d'Ofschëss am Kalennerjoer {n} (wiel uewen e Joer fir en anert Joer).","Abschüsse als CSV":"Ofschëss als CSV","Abschüsse und Sichtungen":"Ofschëss an Observatiounen","Sicherung (JSON)":"Sécherung (JSON)","Nur Abschüsse":"Nëmmen Ofschëss","Nur Sichtungen":"Nëmmen Observatiounen","unbekannt":"onbekannt","weiblich":"weiblech","gemischt":"gemëscht","Mit einem Konto kannst du Gruppen anlegen oder einer Gruppe beitreten und Einträge mit anderen Jägern deines Loses teilen.":"Mat engem Kont kanns du Gruppen uleeën oder enger Grupp bäitrieden an Androungen mat anere Jäger vun dengem Lous deelen.","@tab Statistik":"Statistik","@tab Einträge":"Lëscht","Willkommen im Revierbuch":"Wëllkomm am Revéierbuch","Dein Jagdbuch für die Hosentasche: Karte, Abschüsse, Sichtungen, Ansitze und Statistik, auch ohne Netz im Wald. Die Einführung dauert eine Minute. Die Sprache stellst du unter „Daten“ ein.":"Däi Juegdbuch fir d'Täsch: Kaart, Ofschëss, Observatiounen, Hochsitze a Statistik, och ouni Netz am Bësch. D'Aféierung dauert eng Minutt. D'Sprooch stells du ënner „Daten“ an.","Karte und Lose":"Kaart a Lous","Alle Jagdlose Luxemburgs sind auf der Karte. Tippe auf dein Los, um es als dein Los zu markieren, oder gib die Nummer unter „Daten“ ein. Rechts findest du Zoom, deinen Standort und die Legende zum Ein- und Ausblenden.":"All Juegdlous vu Lëtzebuerg sinn op der Kaart. Tipp op däi Lous fir en als däi Lous ze markéieren, oder gëff d'Nummer ënner „Daten“ an. Riets fënns du Zoom, deng Standuert an d'Legend fir ze weisen a ze verstoppen.","Mit dem Knopf „Eintragen“ legst du Abschüsse, Wildsichtungen, Kanzeln und andere Einrichtungen, Flächen und Tracks an. Tipp: Auf der Karte lange drücken, um direkt an dieser Stelle etwas einzutragen.":"Mam Knäppchen „Androen“ leess du Ofschëss, Wëldobservatiounen, Hochsitze an aner Aarichtungen, Flächen an Tracken un. Tipp: Op der Kaart laang drécken, fir direkt op dëser Plaz eppes anzedroen.","Abschüsse und Wildmarken":"Ofschëss a Wëldmarken","Beim Abschuss trägst du Wildart, Geschlecht, Gewicht und Wildmarke ein. Die App prüft die Jagdzeiten, warnt vor Schonzeiten und erinnert an die Meldung bei der Naturverwaltung. Unklare Treffer legen eine offene Nachsuche an.":"Beim Ofschoss gëss du Wëldaart, Geschlecht, Gewiicht a Wëldmark an. D'App kontrolléiert d'Juegdzäiten, warnt viru Schounzäiten an erënnert un d'Meldung bei der Naturverwaltung. Onkloer Treffer leeë eng oppen Nosich un.","Ansitze und Drückjagden":"Hochsitze an Klappjuegten","Reserviere Kanzeln für einen Ansitz, damit sich niemand in die Quere kommt. Für eine Drückjagd legst du Posten an, wählst sie aus und trägst die Schützen ein. Unter „Jagd“ siehst du alles auf einen Blick.":"Reservéier Hochsitze fir en Ansëtz, domat sech keen an de Wee kënnt. Fir eng Klappjuegd leess du Posten un, wiels se aus a gëss d'Schëtzen an. Ënner „Juegd“ gesäis du alles op ee Bléck.","Statistik und Abschussplan":"Statistik an Ofschossplang","Die Statistik zeigt Abschüsse nach Wildart, Kanzel und Monat. Mit dem Plan de tir deiner Lose siehst du, wie weit du bist. Wildschäden erfasst du mit Fläche, Preis pro ar und Jahresvergleich.":"D'Statistik weist Ofschëss no Wëldaart, Hochsitz a Mount. Mam Plan de tir vun dengen Lous gesäis du, wéi wäit du bass. Wëldschied erfaasse mat Fläch, Präis pro Ar a Joervergläich.","Gruppen und Konto":"Gruppen a Kont","Ein Konto ist freiwillig. Damit legst du Gruppen für dein Los an, lädst Mitjäger per Code ein und vergibst Rollen. Ohne Konto bleibt alles nur auf deinem Gerät, erstelle dann regelmäßig eine Sicherung unter „Daten“.":"E Kont ass fräiwëlleg. Domat leess du Gruppen fir däi Lous un, lëss Matjeeër per Code an a gëss Rollen. Ouni Kont bleift alles nëmmen op dengem Apparat, maach dann regelméisseg eng Sécherung ënner „Daten“.","iPhone: In Safari auf „Teilen“ tippen, dann „Zum Home-Bildschirm“. Android: In Chrome das Menü öffnen, dann „App installieren“. Die Reiter unten kannst du lang drücken, um sie zu verschieben oder auszublenden.":"iPhone: A Safari op „Deelen“ tippen, dann „Zum Home-Bildschirm“. Android: A Chrome d'Menü opmaachen, dann „App installéieren“. D'Reider ënnen kanns du laang drécken, fir se ze verréckelen oder ze verstoppen.","Überspringen":"Iwwersprangen","Los geht’s":"Lass geet’s","Einführung":"Aféierung","Eine kurze Tour durch die wichtigsten Funktionen.":"Eng kuerz Tour duerch déi wichtegst Funktiounen.","Einführung ansehen":"Aféierung kucken"},"en":{"(freie Lizenz). Für die App in WGS 84 umgerechnet und auf etwa einen Meter vereinfacht.":"(free licence). Converted to WGS 84 for the app and simplified to about one metre.","(in der App unter Daten > Konto und Gruppen > Einladung einlösen).":"(in the app under Data > Account and groups > Redeem invitation).","(mindestens 8 Zeichen)":"(at least 8 characters)","(unterbrochen)":"(interrupted)","(wähle oben ein Jahr für ein anderes Jahr)":"(pick a year above for another year)","+ Abschuss":"+ Kill","+ Ansitz reservieren":"+ Reserve a seat","+ Fläche":"+ Area","+ Fläche einzeichnen":"+ Draw area","+ Gruppe":"+ Group","+ Gruppe erstelle als CSV":"Kills as CSV","Abschüsse und Sichtungen":"Kills and sightings","Sicherung (JSON)":"Backup (JSON)","Nur Abschüsse":"Kills only","Nur Sichtungen":"Sightings only","unbekannt":"unknown","weiblich":"female","gemischt":"mixed","Mit einem Konto kannst du Gruppen anlegen oder einer Gruppe beitreten und Einträge mit anderen Jägern deines Loses teilen.":"With an account you can create groups or join one and share entries with other hunters of your lot.","@tab Statistik":"Statistik","@tab Einträge":"Entries","Willkommen im Revierbuch":"Welcome to Revierbuch","Dein Jagdbuch für die Hosentasche: Karte, Abschüsse, Sichtungen, Ansitze und Statistik, auch ohne Netz im Wald. Die Einführung dauert eine Minute. Die Sprache stellst du unter „Daten“ ein.":"Your hunting journal for your pocket: map, kills, sightings, sits and statistics, even without a network in the forest. The introduction takes a minute. You set the language under \"Data\".","Karte und Lose":"Map and lots","Alle Jagdlose Luxemburgs sind auf der Karte. Tippe auf dein Los, um es als dein Los zu markieren, oder gib die Nummer unter „Daten“ ein. Rechts findest du Zoom, deinen Standort und die Legende zum Ein- und Ausblenden.":"All hunting lots of Luxembourg are on the map. Tap your lot to mark it as yours, or enter its number under \"Data\". On the right you find zoom, your location and the legend for showing and hiding.","Mit dem Knopf „Eintragen“ legst du Abschüsse, Wildsichtungen, Kanzeln und andere Einrichtungen, Flächen und Tracks an. Tipp: Auf der Karte lange drücken, um direkt an dieser Stelle etwas einzutragen.":"With the \"Add\" button you create kills, game sightings, high seats and other facilities, areas and tracks. Tip: long-press on the map to add something right at that spot.","Abschüsse und Wildmarken":"Kills and game tags","Beim Abschuss trägst du Wildart, Geschlecht, Gewicht und Wildmarke ein. Die App prüft die Jagdzeiten, warnt vor Schonzeiten und erinnert an die Meldung bei der Naturverwaltung. Unklare Treffer legen eine offene Nachsuche an.":"For a kill you enter species, sex, weight and game tag. The app checks the hunting seasons, warns about closed seasons and reminds you of the report to the Nature Agency. Unclear hits create an open tracking.","Ansitze und Drückjagden":"Sits and driven hunts","Reserviere Kanzeln für einen Ansitz, damit sich niemand in die Quere kommt. Für eine Drückjagd legst du Posten an, wählst sie aus und trägst die Schützen ein. Unter „Jagd“ siehst du alles auf einen Blick.":"Reserve high seats for a sit so nobody gets in the way. For a driven hunt you create stands, choose them and enter the shooters. Under \"Hunt\" you see everything at a glance.","Statistik und Abschussplan":"Statistics and cull plan","Die Statistik zeigt Abschüsse nach Wildart, Kanzel und Monat. Mit dem Plan de tir deiner Lose siehst du, wie weit du bist. Wildschäden erfasst du mit Fläche, Preis pro ar und Jahresvergleich.":"The statistics show kills by species, high seat and month. With the plan de tir of your lots you see how far along you are. Game damage is recorded with area, price per are and a year comparison.","Gruppen und Konto":"Groups and account","Ein Konto ist freiwillig. Damit legst du Gruppen für dein Los an, lädst Mitjäger per Code ein und vergibst Rollen. Ohne Konto bleibt alles nur auf deinem Gerät, erstelle dann regelmäßig eine Sicherung unter „Daten“.":"An account is optional. With it you create groups for your lot, invite fellow hunters by code and assign roles. Without an account everything stays only on your device, so make a backup under \"Data\" regularly.","iPhone: In Safari auf „Teilen“ tippen, dann „Zum Home-Bildschirm“. Android: In Chrome das Menü öffnen, dann „App installieren“. Die Reiter unten kannst du lang drücken, um sie zu verschieben oder auszublenden.":"iPhone: in Safari tap \"Share\", then \"Add to Home Screen\". Android: in Chrome open the menu, then \"Install app\". You can long-press the tabs at the bottom to move function bboxOf(polys){var a=180,b=90,c=-180,d=-90;polys.forEach(function(p){p[0].forEach(function(q){if(q[0]<a)a=q[0];if(q[0]>c)c=q[0];if(q[1]<b)b=q[1];if(q[1]>d)d=q[1]})});return [a,b,c,d]}
function inRing(x,y,ring){var ins=false;for(var i=0,j=ring.length-1;i<ring.length;j=i++){var xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins}return ins}
var TS=256;
function mx(lon,z){return (lon+180)/360*TS*Math.pow(2,z)}
function my(lat,z){var s=Math.sin(lat*Math.PI/180);return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*TS*Math.pow(2,z)}
function lonOf(x,z){return x/(TS*Math.pow(2,z))*360-180}
function latOf(y,z){var n=Math.PI-2*Math.PI*y/(TS*Math.pow(2,z));return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)))}

var CADBASE='https://wms.inspire.geoportail.lu/geoserver/cp/';
function cadUrls(lat,lon){

    if(!(pts[0][0]>49&&pts[0][0]<50.3&&pts[0][1]>5.6&&pts[0][1]<6.6))return;

function cropSums(Y){
  var by={},tot=0,n=0,leer=0;
  parcels().forEach(function(p){
    var cs;if(Y==null||Y==='all')cs=[curCrop(p)].filter(Boolean);
    else{var a=cropList(p),y0=Y+'-01-01',y1=Y+'-12-31';cs=a.filter(function(e){return e.from<=y1&&(!e.to||e.to>=y0)}).map(function(e){return e.crop});cs=cs.filter(function(c,i){return cs.indexOf(c)===i})}
    tot+=p.m2;n++;
    if(!cs.length){leer+=p.m2;return}
    cs.forEach(function(c){var k=c.toLowerCase();(by[k]=by[k]||{crop:c,m2:0,n:0}).m2+=p.m2;by[k].n++});
  });
  return {rows:Object.keys(by).map(function(k){return by[k]}).sort(function(a,b){return b.m2-a.m2}),tot:tot,n:n,leer:leer};
}
function cropSumHtml(Y,card){

  var h=(card?'<div class="card"><h2 class="sec">Fläche nach Kultur'+(Y==null||Y==='all'?' · aktuell':' · '+Y)+'</h2>':'<div class="field" style="margin:0 0 12px"><span class="lbl">Fläche nach Kultur · aktuell</span>')+

function planCatOf(k){
  var sp=k.species,m=k.sex==='m',w=k.sex==='w',j=k.age==='juv';
  if(sp==='Rehwild')return 0;if(sp==='Schwarzwild')return 1;

}

/* ---------- Aktionen ---------- */
function accBusy(b,on){if(b){b.disabled=!!on}}
function accReload(){return accLoadGroups().then(function(){return accGroup(ACC.cur)})}
function accRun(b,p,okFn,failFn){accBusy(b,true);return p.then(function(r){accBusy(b,false);if(okFn)okFn(r)},function(e){accBusy(b,false);if(failFn)failFn(e);else accNote(accMsg(e))})}
function confirm2(b,txt){if(b.dataset.s!=='1'){b.dataset.s='1';b.dataset.t=b.textContent;b.textContent=txt||'Wirklich?';setTimeout(function(){if(b.isConnected){b.dataset.s='';b.textContent=b.dataset.t}},3500);return false}return true}
function lotList(str){return String(str||'').split(/[^0-9]+/).filter(Boolean).map(function(x){return String(parseInt(x,10))}).filter(function(x,i,a){return x!=='0'&&x!=='NaN'&&a.indexOf(x)===i})}

$('#sheetBody').addEventListener('click',function(e){
  var b=e.target.closest('[data-acc]');if(!b||b.disabled)return;
  var a=b.dataset.acc,v=b.dataset.v,d=ACC.det,val=function(id){var n=$(id);return n?n.value.trim():''};
  if(a==='close'){closeSheet()}
  else if(a==='home'){accSheet()}
  else if(a==='mode'){accAuthView(v,'',val('#ac-mail'))}
  else if(a==='login'||a==='signup'){
    var mail=val('#ac-mail'),pw=($('#ac-pw')||{}).value||'',nm=val('#ac-name');
    if(!mail||!pw){accNote('Bitte E-Mail und Passwort eingeben.');return}
    if(a==='signup'&&pw.length<8){accNote('Das Passwort braucht mindestens 8 Zeichen.');return}
    if(a==='signup'&&!nm){accNote('Bitte einen Anzeigenamen eingeben.');return}
    accBusy(b,true);accNote('');
    var req=a==='login'?sbRaw('/auth/v1/token?grant_type=password',{method:'POST',body:{email:mail,password:pw}}):sbRaw('/auth/v1/signup',{method:'POST',body:{email:mail,password:pw,data:{display_name:nm}}});
    req.then(function(r){
      if(!r||!r.access_token){accBusy(b,false);accAuthView('login','Wir haben dir eine Bestätigungs-Mail geschickt. Öffne den Link darin und melde dich danach an.',mail);return}
      accSetSess(r);accSheet();
    }).catch(function(er){accBusy(b,false);accNote(accMsg(er))});
  }
  else if(a==='forgot'){
    var m2=val('#ac-mail');if(!m2){accNote('Bitte zuerst deine E-Mail eingeben.');return}
    accRun(b,sbRaw('/auth/v1/recover',{method:'POST',body:{email:m2}}),function(){accNote('Falls die Adresse registriert ist, wurde eine E-Mail zum Zurücksetzen gesendet.',false)});
  }
  else if(a==='logout'){
    var tok=ACC.sess&&ACC.sess.access;ACC.sess=null;ACC.groups=null;accSaveSess();renderHeader();
    if(tok)sbRaw('/auth/v1/logout',{method:'POST'},tok).catch(function(){});
    closeSheet();toast('Abgemeldet');
  }
  else if(a==='consent'){
    if(!($('#ac-ok')||{}).checked){accNote('Bitte die Datenschutzerklärung bestätigen.');return}
    accRun(b,sbApi('/rest/v1/consents',{method:'POST',body:{user_id:accUid(),doc_version:PRIV_VER},headers:{Prefer:'return=minimal'}}),function(){accSheet()});
  }
  else if(a==='rename'){
    accShell('Anzeigename','<label class="field"><span class="lbl">Name (für Mitglieder deiner Gruppen sichtbar)</span><input type="text" id="ac-name" maxlength="60" value="'+esc(ACC.name)+'"></label><p class="warnbox" id="ac-msg" hidden></p><div class="btnrow"><button class="btn primary" type="button" data-acc="savename" style="flex:2">Speichern</button><button class="btn" type="button" data-acc="home" style="flex:1">Abbrechen</button></div>');
  }
  else if(a==='savename'){
    var nn=val('#ac-name');if(!nn){accNote('Bitte einen Namen eingeben.');return}
    accRun(b,sbApi('/rest/v1/profiles?id=eq.'+accUid(),{method:'PATCH',body:{display_name:nn}}),function(){ACC.name=nn;try{localStorage.setItem('revierbuch.accname',nn)}catch(_){}renderHeader();accSheet()});
  }
  else if(a==='newgroup'){accNewGroup()}
  else if(a==='creategroup'){
    var gn=val('#ac-gname'),lots=$$('.ac-lot').filter(function(x){return x.checked}).map(function(x){return x.value}).concat(lotList(val('#ac-lotx')));
    lots=lots.filter(function(x,i,ar){return ar.indexOf(x)===i});
    if(!gn){accNote('Bitte einen Namen eingeben.');return}
    if(!lots.length){accNote('Bitte mindestens ein Los angeben.');return}
    accRun(b,sbRpc('create_group',{p_name:gn,p_lots:lots}),function(id){accLoadGroups().then(function(){accGroup(id)})});
  }
  else if(a==='join'){
    var code=val('#ac-code').toLowerCase().replace(/[^a-z0-9]/g,'');if(!code){accNote('Bitte den Einladungscode eingeben.');return}
    accRun(b,sbRpc('accept_invite',{p_code:code}),function(id){accLoadGroups().then(function(){toast('Du bist jetzt in der Gruppe.');accGroup(id)})});
  }
  else if(a==='group'){accGroup(v)}
  else if(a==='addlot'){
    var ls=lotList(val('#ac-addlot'));if(!ls.length){accNote('Bitte eine Losnummer eingeben.');return}
    accRun(b,Promise.all(ls.map(function(x){return sbRpc('add_lot',{p_group:ACC.cur,p_lot:x})})),function(){accReload()});
  }
  else if(a==='rmlot'){
    if(!confirm2(b,'Entfernen?'))return;
    accRun(b,sbApi('/rest/v1/group_lots?group_id=eq.'+ACC.cur+'&lot_id=eq.'+encodeURIComponent(v),{method:'DELETE'}),function(){accReload()});
  }
  else if(a==='approve'){accRun(b,sbRpc('approve_lot',{p_group:b.dataset.g,p_lot:v}),function(){toast('Freigegeben');accReload()})}
  else if(a==='reject'){
    if(!confirm2(b,'Ablehnen?'))return;
    accRun(b,sbApi('/rest/v1/group_lots?group_id=eq.'+encodeURIComponent(b.dataset.g)+'&lot_id=eq.'+encodeURIComponent(v),{method:'DELETE'}),function(){accReload()});
  }
  else if(a==='rmmember'){
    if(!confirm2(b,'Wirklich?'))return;
    accRun(b,sbApi('/rest/v1/group_members?group_id=eq.'+ACC.cur+'&user_id=eq.'+v,{method:'DELETE'}),function(){accReload()});
  }
  else if(a==='leave'){
    if(!confirm2(b,'Wirklich verlassen?'))return;
    accRun(b,sbApi('/rest/v1/group_members?group_id=eq.'+ACC.cur+'&user_id=eq.'+accUid(),{method:'DELETE'}),function(){accLoadGroups().then(accHome)});
  }
  else if(a==='delgroup'){
    if(!confirm2(b,'Gruppe wirklich löschen?'))return;
    accRun(b,sbApi('/rest/v1/groups?id=eq.'+ACC.cur,{method:'DELETE'}),function(){accLoadGroups().then(accHome)});
  }
  else if(a==='addrole'){
    var rn=val('#ac-nrole');if(!rn){accNote('Bitte einen Namen eingeben.');return}
    accRun(b,sbApi('/rest/v1/group_roles',{method:'POST',body:{group_id:ACC.cur,name:rn,perms:ACC_GAST},headers:{Prefer:'return=minimal'}}),function(){accReload()});
  }
  else if(a==='rmrole'){
    if(!confirm2(b,'Rolle löschen?'))return;
    accRun(b,sbApi('/rest/v1/group_roles?id=eq.'+v,{method:'DELETE'}),function(){accReload()});
  }
  else if(a==='mkinvite'){
    var role=val('#ac-irole'),uses=parseInt(val('#ac-iuses'),10)||1;if(!role){accNote('Bitte eine Rolle wählen.');return}
    accRun(b,sbApi('/rest/v1/group_invites',{method:'POST',body:{group_id:ACC.cur,role_id:role,max_uses:uses},headers:{Prefer:'return=representation'}}),function(r){
      var c=r&&r[0]&&r[0].code;accGroup(ACC.cur).then(function(){accGroupView('',c)})});
  }
  else if(a==='rminvite'){accRun(b,sbApi('/rest/v1/group_invites?code=eq.'+encodeURIComponent(v),{method:'DELETE'}),function(){accReload()})}
  else if(a==='sharecode'){
    var nice=v.match(/.{1,4}/g).join('-'),txt='Einladung zur Gruppe „'+d.g.name+'“ im Revierbuch: Code '+nice+' (in der App unter Daten > Konto und Gruppen > Einladung einlösen). '+location.href.split('#')[0];
    if(navigator.share)navigator.share({text:txt}).catch(function(){});
    else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(function(){toast('Einladung kopiert')},function(){toast(nice)});
    else toast(nice);
  }
});
$('#sheetBody').addEventListener('change',function(e){
  var t=e.target,d=ACC.det;if(!d)return;
  if(t.dataset.accPerm){
    var r=d.roles.filter(function(x){return x.id===t.dataset.accPerm})[0],p=Object.assign({},r.perms||{});
    if(t.value==='none')delete p[t.dataset.cat];else p[t.dataset.cat]=t.value;
    sbApi('/rest/v1/group_roles?id=eq.'+r.id,{method:'PATCH',body:{perms:p}}).then(function(){r.perms=p;toast('Gespeichert')},function(er){toast(accMsg(er))});
  }else if(t.dataset.accRname!==undefined){
    var nm=t.value.trim(),r2=d.roles.filter(function(x){return x.id===t.dataset.accRname})[0];if(!nm){t.value=r2.name;return}
    sbApi('/rest/v1/group_roles?id=eq.'+r2.id,{method:'PATCH',body:{name:nm}}).then(function(){r2.name=nm;toast('Gespeichert')},function(er){t.value=r2.name;toast(accMsg(er))});
  }else if(t.dataset.accMrole){
    var uid=t.dataset.accMrole,m=d.members.filter(function(x){return x.user_id===uid})[0],toAdmin=t.value==='admin';
    if(m.is_admin&&!toAdmin&&d.members.filter(function(x){return x.is_admin}).length<2){toast('Es braucht mindestens einen Administrator.');t.value='admin';return}
    var body=toAdmin?{is_admin:true}:{is_admin:false,role_id:t.value};
    sbApi('/rest/v1/group_members?group_id=eq.'+ACC.cur+'&user_id=eq.'+uid,{method:'PATCH',body:body}).then(function(){m.is_admin=toAdmin;if(!toAdmin)m.role_id=t.value;toast('Gespeichert');if(uid===accUid())accLoadGroups()},function(er){toast(accMsg(er));accGroup(ACC.cur)});
  }
});

var GTAB={t:0,err:false};
function renderGroups(){
  var el=$('#groupsBody');if(!el)return;
  var h='<div class="card"><h2 class="sec">Gruppen</h2>';
  if(!ACC.sess){
    el.innerHTML=h+'<p class="hint">Mit einem Konto kannst du Gruppen anlegen oder einer Gruppe beitreten und Einträge mit anderen Jägern deines Loses teilen.</p><div class="btnrow"><button class="btn primary" type="button" data-accopen>Anmelden oder registrieren</button></div></div>';
    return;
  }
  var gs=ACC.groups;
  if(!gs&&GTAB.err){
    el.innerHTML=h+'<p class="warnbox">Keine Verbindung. Bitte später noch einmal versuchen.</p><div class="btnrow"><button class="btn" type="button" data-gtab="reload">Noch einmal</button></div></div>';return;
  }
  if(!gs||Date.now()-GTAB.t>30000){
    GTAB.t=Date.now();GTAB.err=false;
    accLoadAll().then(function(ok){if(!ok)GTAB.err=true;if(S.tab==='groups')renderGroups()},function(){GTAB.err=true;if(S.tab==='groups')renderGroups()});
  }
  if(!gs){el.innerHTML=h+'<p class="hint">Lade …</p></div>';return}
  h+=gs.length?'<div class="rows">'+gs.map(function(g){
    return '<div class="lotrow" style="flex-wrap:wrap"><span style="flex:1;min-width:140px"><b>'+esc(g.name)+'</b><br><small>'+esc(g.role)+' · '+g.lots.length+' Los'+(g.lots.length===1?'':'e')+'</small></span><button class="btn sm" type="button" data-gtab="group" data-v="'+esc(g.id)+'">Öffnen</button></div>';
  }).join('')+'</div>':'<p class="hint">Du bist noch in keiner Gruppe.</p>';
  h+='<div class="btnrow" style="margin-top:8px"><button class="btn primary" type="button" data-gtab="new">+ Gruppe erstellen</button><button class="btn" type="button" data-gtab="join">Einladung einlösen</button></div></div>';
  el.innerHTML=h;
}

 ['start','Willkommen im Revierbuch','Dein Jagdbuch für die Hosentasche: Karte, Abschüsse, Sichtungen, Ansitze und Statistik, auch ohne Netz im Wald. Die Einführung dauert eine Minute. Die Sprache stellst du unter „Daten“ ein.'],

 ['list','Eintragen','Mit dem Knopf „Eintragen“ legst du Abschüsse, Wildsichtungen, Kanzeln und andere Einrichtungen, Flächen und Tracks an. Tipp: Auf der Karte lange drücken, um direkt an dieser Stelle etwas einzutragen.'],
 ['hunt','Abschüsse und Wildmarken','Beim Abschuss trägst du Wildart, Geschlecht, Gewicht und Wildmarke ein. Die App prüft die Jagdzeiten, warnt vor Schonzeiten und erinnert an die Meldung bei der Naturverwaltung. Unklare Treffer legen eine offene Nachsuche an.'],

   '<div style="display:flex;gap:6px;justify-content:center;margin:6px 0 14px" aria-hidden="true">'+dots+'</div></div>'+
   '<div class="btnrow">'+(i>0?'<button class="btn" type="button" data-wel="'+(i-1)+'">Zurück</button>':'<button class="btn" type="button" data-wel="x">Überspringen</button>')+
   '<button class="btn primary" type="button" data-wel="'+(last?'x':i+1)+'" style="flex:2">'+(last?'Los geht’s':'Weiter')+'</button></div>');
}

var ptrs=new Map(),gest=null,lastTap={t:0,x:0,y:0};

cv.addEventListener('pointerdown',function(e){
  try{cv.setPointerCapture(e.pointerId)}catch(x){}
  if(e.isPrimary&&ptrs.size>0){ptrs.clear();clearLong()}
  ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(ptrs.size===1){gest={sx:e.offsetX,sy:e.offsetY,t:performance.now(),moved:false};armLong(gest)}
  else if(ptrs.size===2){clearLong();gest=gest||{};gest.moved=true;gest.d=pd();gest.mid=pm()}
});
cv.addEventListener('pointermove',function(e){
  var p=ptrs.get(e.pointerId);if(!p)return;
  var ox=p.x,oy=p.y;p.x=e.offsetX;p.y=e.offsetY;
  if(ptrs.size===1){
    if(Math.hypot(p.x-gest.sx,p.y-gest.sy)>14){gest.moved=true;clearLong()}
    if(gest.moved&&!gest.long)anchor(fromScr(ox,oy),p.x,p.y,S.view.z);
  }else if(ptrs.size===2){
    var d=pd(),m=pm(),geo=fromScr(gest.mid.x,gest.mid.y);

  }
});
function endPtr(e){

    var now=Date.now();

  }

function onTap(px,py){
  if(S.placing)return;
  var hs=shotHit(px,py);if(hs){showShot(hs.h.id,hs.s.id);return}
  var mh=meetHit(px,py);if(mh){showMeet(mh);return}
  var its=items(),best=null,bd=Math.max(16,24*MKS);
  for(var i=its.length-1;i>=0;i--){var s=toScr(its[i].o.lat,its[i].o.lon),d=Math.hypot(s.x-px,s.y-py);if(d<bd){bd=d;best=its[i]}}
  if(best){S.sel={k:best.k,id:best.o.id};dirty=true;showDetail(best.k,best.o);return}
  S.sel=null;dirty=true;
  var ph=parcelHit(px,py);S.parHi=ph?ph.id:null;if(ph){showParcel(ph.id);return}
  var wx=(mx(S.view.lon,S.view.z)+px-W/2)/Math.pow(2,S.view.z),wy=(my(S.view.lat,S.view.z)+py-H/2)/Math.pow(2,S.view.z),hit=null;
  lotsAll().forEach(function(l){
    var mine=isMine(l);if(mine?!S.layers.lots:!S.layers.all)return;

  });

}

function gpsFail(e){
  if(S.watch!=null){try{navigator.geolocation.clearWatch(S.watch)}catch(x){}S.watch=null}
  S.gpsState='off';S.gps=null;dirty=true;renderHeader();
  toast('Der Standort ist nicht verfügbar. Erlaube den Standortzugriff in den Einstellungen deines Browsers oder setze die Position über die Karte.');
}
function getPos(){
  return new Promise(function(res,rej){
    if(S.gps&&Date.now()-S.gps.t<15000)return res(S.gps);
    if(!navigator.geolocation)return rej(new Error('no geo'));
    var t=setTimeout(function(){rej(new Error('timeout'))},9000);
    try{navigator.geolocation.getCurrentPosition(function(p){clearTimeout(t);res({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()})},function(e){clearTimeout(t);rej(e)},{enableHighAccuracy:true,timeout:8000,maximumAge:5000})}catch(e){clearTimeout(t);rej(e)}
  });
}
function startWatch(){
  if(S.watch!=null||!navigator.geolocation)return;
  try{S.watch=navigator.geolocation.watchPosition(function(p){S.gps={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,hd:p.coords.heading,sp:p.coords.speed,t:Date.now()};S.gpsState='on';dirty=true;renderHeader();updateGuide();trkPoint()},function(e){if(e&&e.code===1)gpsFail(e);else{S.gpsState='busy';renderHeader()}},{enableHighAccuracy:true,maximumAge:3000,timeout:20000})}catch(e){gpsFail()}
}
function locate(center){
  S.gpsState='busy';renderHeader();
  return getPos().then(function(p){S.gps=p;S.gpsState='on';if(center)centerOn(p.lat,p.lon,Math.max(S.view.z,16));startWatch();dirty=true;renderHeader();return p}).catch(function(e){gpsFail(e);throw e});
}

/* ---------- stats tab ---------- */
function renderStats(){
  var kills=G('kills'),sights=G('sightings'),yr=function(x){return new Date(x.ts).getFullYear()};
  var years=Array.from(new Set(kills.concat(sights).map(yr))).sort(function(a,b){return b-a});
  if(S.statYear!=='all'&&years.indexOf(+S.statYear)<0)S.statYear='all';
  var Y=S.statYear,ks=kills.filter(function(k){return Y==='all'||yr(k)===+Y}),ss=sights.filter(function(k){return Y==='all'||yr(k)===+Y});
  function group(arr,fn){var m=new Map();arr.forEach(function(x){var k=fn(x),e=m.get(k)||{n:0,w:0,wn:0};e.n++;if(x.weight!=null){e.w+=x.weight;e.wn++}m.set(k,e)});return Array.from(m).sort(function(a,b){return b[1].n-a[1].n})}
  function bars(rows,fmt){var mx=Math.max.apply(null,rows.map(function(r){return r[1].n}));return '<div class="bars">'+rows.map(function(r){return '<div class="bar"><span class="bl">'+esc(r[0])+(fmt?'<small>'+fmt(r)+'</small>':'')+'</span><span class="bt"><i style="width:'+Math.round(r[1].n/mx*100)+'%"></i></span><span class="bv">'+r[1].n+'</span></div>'}).join('')+'</div>'}
  var html='<div class="field"><span class="lbl">Zeitraum</span><select id="statYear"><option value="all">Alle Jahre</option>'+years.map(function(y){return '<option value="'+y+'"'+(String(Y)===String(y)?' selected':'')+'>'+y+'</option>'}).join('')+'</select></div>';
  if(useDemo())html+='<div class="warnbox">Das sind Beispieldaten. Sie verschwinden mit deinem ersten Eintrag.</div>';
  if(!ks.length){html+='<div class="empty">Für diesen Zeitraum gibt es noch keine Abschüsse. Trage sie unter „Einträge“ ein, dann erscheint hier die Auswertung.</div>'}
  else{
    var bySp=group(ks,function(k){return k.species}),byK=group(ks,function(k){return k.kanzelId?facName(k.kanzelId)||'Gelöschte Kanzel':'Ohne Kanzel'});
    var mc=new Array(12).fill(0);ks.forEach(function(k){mc[new Date(k.ts).getMonth()]++});var mm=Math.max.apply(null,mc);
    var sightByK={};ss.forEach(function(s){var n=s.kanzelId?facName(s.kanzelId):'Ohne Kanzel';sightByK[n]=(sightByK[n]||0)+(s.count||1)});
    html+='<div class="card"><span class="lbl">Abschüsse gesamt</span><div class="big">'+ks.length+'</div></div>'+
    '<div class="card"><h2 class="sec">Nach Wildart</h2>'+bars(bySp,function(r){return r[1].wn?'Ø '+nf.format(r[1].w/r[1].wn)+' kg aufgebrochen':''})+'</div>'+
    '<div class="card"><h2 class="sec">Nach Kanzel</h2>'+bars(byK,function(r){return (sightByK[r[0]]||0)+' Wild gesehen'})+'</div>'+
    '<div class="card"><h2 class="sec">Nach Monat</h2><div class="months">'+mc.map(function(n,i){return '<div><em>'+(n||'')+'</em><i style="height:'+Math.round(n/mm*100)+'px"></i>'+MONTHS[i]+'</div>'}).join('')+'</div></div>';
    var cnt=new Map();ss.forEach(function(s){cnt.set(s.species,(cnt.get(s.species)||0)+(s.count||1))});
    var rows=Array.from(cnt).sort(function(a,b){return b[1]-a[1]}).map(function(r){return [r[0],{n:r[1]}]});
    if(rows.length)html+='<div class="card"><h2 class="sec">Gesehenes Wild</h2>'+bars(rows)+'</div>';
  }
  html+=recentCardHtml()+jzCardHtml()+cropSumHtml(Y==='all'?null:+Y,true)+lotPlanCardHtml(kills)+damageCardHtml(Y)+planCardHtml(Y,kills);
  $('#statsBody').innerHTML=html;statLayout();
  $('#statYear').onchange=function(e){S.statYear=e.target.value;renderStats()};
  bindPlan(Y);bindDamage();bindLotPlan();jzBind();recentBind();
}

  '<p class="hint">Alle Lose von Luxemburg (gültig ab 1. April 2021) sind auf der Karte sichtbar. Tippe dort auf ein Los, um es als dein Los zu markieren, oder gib die Nummer ein.</p>'+
  '<div class="btnrow"><input type="number" inputmode="numeric" id="addNo" placeholder="Losnummer" min="1" style="flex:1;min-width:120px"><button class="btn primary" id="addLot" type="button">Hinzufügen</button></div>'+
  (mineNos.length?'<div class="rows">'+mineNos.map(function(n){var b=BASE.filter(function(x){return x.no===n})[0];return '<div class="lotrow"><span><b>Los '+n+'</b>'+(b&&b.ha?' · '+nf.format(b.ha)+' ha':'')+'</span><button class="btn sm" data-fit="'+n+'" type="button">Anzeigen</button><button class="btn sm danger" data-rm="'+n+'" type="button">Entfernen</button></div>'}).join('')+'</div>':'<p class="hint">Noch kein Los markiert.</p>')+
  (lots.length?'<div class="rows">'+lots.map(function(l){return '<div class="lotrow"><span><b>'+esc(l.name)+'</b> · eigene Grenze</span><button class="btn sm" data-cfit="'+esc(l.id)+'" type="button">Anzeigen</button><button class="btn sm danger" data-cdel="'+esc(l.id)+'" type="button">Löschen</button></div>'}).join('')+'</div>':'')+
  '<div class="btnrow"><button class="btn" id="impLots" type="button">Eigene Grenzen einlesen</button></div>'+
  '<p class="hint">Quelle: <a href="https://data.public.lu/en/datasets/hunting-units/" target="_blank" rel="noopener">Lots de chasse, Administration de la nature et des forêts</a> (freie Lizenz). Für die App in WGS 84 umgerechnet und auf etwa einen Meter vereinfacht.</p></div>';
  html+=welCardHtml();html+=langCardHtml();html+=accCardHtml();html+='<div class="card"><h2 class="sec">Speicher und Export</h2>'+
  '<p class="hint">'+(S.mode==='cloud'?'Deine Einträge liegen privat in deinem Konto und sind auf allen deinen Geräten verfügbar.':'Deine Einträge bleiben nur in diesem Browser. Erstelle regelmäßig eine Sicherung.')+'</p>'+
  '<div class="btnrow"><button class="btn" id="expCsv" type="button"'+''+'>Abschüsse als CSV</button><button class="btn" id="expJson" type="button"'+''+'>Sicherung (JSON)</button><button class="btn" id="impJson" type="button">Sicherung einlesen</button></div>'+
  '</div>';
  html+='<div class="card"><h2 class="sec">Beispieldaten</h2><p class="hint">Solange noch nichts eingetragen ist, zeigt die App Beispieldaten.</p><div class="btnrow"><button class="btn" id="exTog" type="button">'+(D.settings.hideExamples?'Beispieldaten wieder einblenden':'Beispieldaten ausblenden')+'</button></div></div>';
  html+=trkCardHtml()+srcCardHtml()+diagCardHtml();
  $('#dataBody').innerHTML=html;
  $('#impLots').onclick=function(){fileMode='lots';$('#fileIn').click()};
  $('#impJson').onclick=function(){fileMode='backup';$('#fileIn').click()};
  $('#exTog').onclick=function(){guard(Store.setting({hideExamples:!D.settings.hideExamples}))};
  var c=$('#expCsv');if(c)c.onclick=exportCsv;var j=$('#expJson');if(j)j.onclick=exportJson;bindSources();bindDiag();bindTracks();
  var add=$('#addLot');if(add)add.onclick=function(){
    var n=parseInt($('#addNo').value,10);
    if(!BASE.length){toast('Die Lose sind noch nicht geladen.');return}
    var l=BASE.filter(function(x){return x.no===n})[0];if(!l){toast('Ein Los mit dieser Nummer gibt es nicht.');return}
    var arr=(D.settings.myLots||[]).slice();if(arr.indexOf(n)<0)arr.push(n);
    guard(Store.setting({myLots:arr})).then(function(){toast('Los '+n+' hinzugefügt');switchTab('map');fitBox(l.bb)},function(){});
  };
  $$('#dataBody [data-fit]').forEach(function(b){b.onclick=function(){var n=+b.dataset.fit,l=BASE.filter(function(x){return x.no===n})[0];if(l){switchTab('map');fitBox(l.bb)}}});
  $$('#dataBody [data-rm]').forEach(function(b){b.onclick=function(){var n=+b.dataset.rm;guard(Store.setting({myLots:(D.settings.myLots||[]).filter(function(x){return x!==n})}))}});
  $$('#dataBody [data-cfit]').forEach(function(b){b.onclick=function(){var l=D.lots.filter(function(x){return x.id===b.dataset.cfit})[0];if(l){switchTab('map');fitBox(l.bb)}}});
  $$('#dataBody [data-cdel]').forEach(function(b){b.onclick=function(){if(b.dataset.s!=='1'){b.dataset.s='1';b.textContent='Sicher?';return}guard(Store.del('lots',b.dataset.cdel),'Löschen fehlgeschlagen')}});
}
function today(){return toLocalInput().slice(0,10)}
function exportJson(){
  var data=JSON.stringify({app:'revierbuch',version:1,exported:new Date().toISOString(),markers:D.markers,sightings:D.sightings,kills:D.kills,lots:D.lots.map(plain),settings:D.settings,tracks:trkLoad()},null,1);
  saveFile({filename:'revierbuch-sicherung-'+today()+'.json',data:data}).then(function(){toast('Sicherung gespeichert')}).catch(function(e){if(!e||e.code!=='declined')toast('Speichern nicht möglich ('+(e&&e.code||'Fehler')+').')});
}
function exportCsv(){
  var q=function(v){v=String(v==null?'':v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var rows=[['Datum','Uhrzeit','Wildart','Geschlecht','Altersklasse','Gewicht kg','Wildmarke','Kanzel','Breite','Länge','Notiz']];
  D.kills.slice().sort(function(a,b){return new Date(a.ts)-new Date(b.ts)}).forEach(function(k){var d=new Date(k.ts);rows.push([d.toLocaleDateString(LOC),d.toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit'}),k.species,SEX[k.sex],AGE[k.age],k.weight==null?'':String(k.weight).replace('.',','),k.tag,facName(k.kanzelId),k.lat.toFixed(6),k.lon.toFixed(6),k.note])});
  if(rows.length===1){toast('Es gibt noch keine eigenen Abschüsse zum Exportieren.');return}
  saveFile({filename:'abschuesse-'+today()+'.csv',data:'﻿'+rows.map(function(r){return r.map(q).join(';')}).join('\r\n')}).then(function(){toast('CSV gespeichert')}).catch(function(e){if(!e||e.code!=='declined')toast('Speichern nicht möglich ('+(e&&e.code||'Fehler')+').')});
}

/* ---------- import ---------- */
var fileMode='lots';
$('#fileIn').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  var r=new FileReader();r.onload=function(){try{handleFile(f.name,String(r.result))}catch(err){toast(err.message||'Datei konnte nicht gelesen werden.')}};r.onerror=function(){toast('Datei konnte nicht gelesen werden.')};r.readAsText(f);
});
function handleFile(name,text){
  var t=text.replace(/^﻿/,'').trim(),feats;
  if(/\.kml$/i.test(name)||t.charAt(0)==='<'){feats=parseKml(t)}
  else{
    var j=JSON.parse(t);
    if(j&&(j.app==='revierbuch'||(j.kills&&j.markers)))return importBackup(j);
    feats=parseGeoJson(j);
  }
  if(!feats.length)throw new Error('Keine Flächen (Polygone) in der Datei gefunden.');
  pickLots(feats);
}
function lotName(p,i){
  p=p||{};var keys=['name','Name','NAME','lot','LOT','Lot','nom','NOM','bezeichnung','BEZEICHNUNG','lot_name','LOT_NAME','lot_nom','LOT_NOM','numero','NUMERO','nr','NR','id','ID'];
  var nl=['NoLot','NOLOT','nolot','No_Lot','NO_LOT','Lot_No','LotNr'];
  for(var n=0;n<nl.length;n++){if(p[nl[n]]!=null&&String(p[nl[n]]).trim()!=='')return 'Los '+String(p[nl[n]]).trim()}
  for(var k=0;k<keys.length;k++){if(p[keys[k]]!=null&&String(p[keys[k]]).trim()!=='')return String(p[keys[k]]).trim()}
  var any=Object.keys(p).filter(function(k){return typeof p[k]==='string'&&p[k].trim()&&p[k].length<60&&!/label|valable/i.test(k)})[0];
  return any?String(p[any]).trim():'Los '+(i+1);
}
function parseGeoJson(j){
  var feats=[];
  if(j.type==='FeatureCollection')feats=j.features||[];else if(j.type==='Feature')feats=[j];else if(j.coordinates)feats=[{type:'Feature',properties:{},geometry:j}];
  var crs=(j.crs&&j.crs.properties&&j.crs.properties.name)||'',out=[],mode=null;
  feats.forEach(function(ft,i){
    var g=ft.geometry;if(!g)return;var polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];
    if(!polys.length)return;
    if(!mode){var s=polys[0][0][0];mode=/3857|900913/.test(crs)?'merc':(Math.abs(s[0])<=180&&Math.abs(s[1])<=90)?'wgs':(Math.abs(s[0])<2.1e7&&s[0]>4e5&&s[0]<9e5&&s[1]>6.1e6&&s[1]<6.6e6)?'merc':'bad'}
    if(mode==='bad')throw new Error('Das Koordinatensystem passt nicht. Exportiere die Datei in QGIS als GeoJSON mit EPSG:4326 (WGS 84).');
    out.push({name:lotName(ft.properties,i),ha:(ft.properties&&ft.properties.Flaeche_ha)||null,polys:polys.map(function(pl){return pl.map(function(ring){return ring.map(function(p){return mode==='merc'?[p[0]/6378137*180/Math.PI,(2*Math.atan(Math.exp(p[1]/6378137))-Math.PI/2)*180/Math.PI]:[p[0],p[1]]})})})});
  });
  return out;
}
function parseKml(t){
  var doc=new DOMParser().parseFromString(t,'text/xml'),out=[];
  $$('Placemark',doc).forEach(function(pm,i){
    var nm=pm.getElementsByTagName('name')[0],polys=[];
    Array.prototype.forEach.call(pm.getElementsByTagName('Polygon'),function(pg){
      var rings=[];Array.prototype.forEach.call(pg.getElementsByTagName('coordinates'),function(c){
        var ring=c.textContent.trim().split(/\s+/).map(function(s){var a=s.split(',').map(parseFloat);return [a[0],a[1]]}).filter(function(a){return isFinite(a[0])&&isFinite(a[1])});
        if(ring.length>3)rings.push(ring)});
      if(rings.length)polys.push(rings);
    });
    if(polys.length)out.push({name:nm&&nm.textContent.trim()||'Los '+(i+1),polys:polys});
  });
  return out;
}
function cleanRing(r){var o=[],last=null;r.forEach(function(p){var q=[Math.round(p[0]*1e5)/1e5,Math.round(p[1]*1e5)/1e5];if(!last||last[0]!==q[0]||last[1]!==q[1]){o.push(q);last=q}});if(o.length&&(o[0][0]!==o[o.length-1][0]||o[0][1]!==o[o.length-1][1]))o.push(o[0].slice());return o}
function thin(polys){return polys.map(function(pl){return pl.map(function(r){if(r.length<12)return r;var o=r.filter(function(p,i){return i===0||i===r.length-1||i%2===0});return o})})}
function pickLots(feats){
  feats.sort(function(a,b){return a.name.localeCompare(b.name,'de',{numeric:true})});
  var pre=feats.length<=5;
  var html='<h2>Lose auswählen</h2><p class="hint">'+feats.length+' Flächen in der Datei. Wähle dein Los und bei Bedarf die Nachbarlose.</p>'+
    (feats.length>5?'<input type="search" id="pkQ" placeholder="Nach Name oder Nummer suchen" autocomplete="off">':'')+'<div class="pick" id="pkList"></div><div class="btnrow"><button class="btn primary" id="pkOk" type="button" style="flex:2">Importieren</button><button class="btn" id="pkNo" type="button" style="flex:1">Abbrechen</button></div>';
  openSheet(html);
  var chosen={};if(pre)feats.forEach(function(f,i){chosen[i]=true});
  function list(){
    var q=($('#pkQ')?$('#pkQ').value:'').trim().toLowerCase(),n=0,h='';
    feats.forEach(function(f,i){if(n>=150)return;if(q&&f.name.toLowerCase().indexOf(q)<0)return;n++;h+='<label><input type="checkbox" data-i="'+i+'"'+(chosen[i]?' checked':'')+'><span>'+esc(f.name)+(f.ha?' · '+nf.format(f.ha)+' ha':'')+'</span></label>'});
    $('#pkList').innerHTML=h||'<p class="hint" style="padding:8px">Nichts gefunden.</p>';
    $$('#pkList input').forEach(function(c){c.onchange=function(){chosen[c.dataset.i]=c.checked;cnt()}});cnt();
  }
  function cnt(){var n=Object.keys(chosen).filter(function(k){return chosen[k]}).length;$('#pkOk').textContent='Importieren ('+n+')';$('#pkOk').disabled=!n}
  if($('#pkQ'))$('#pkQ').oninput=list;list();
  $('#pkNo').onclick=closeSheet;
  $('#pkOk').onclick=function(){
    var sel=feats.filter(function(f,i){return chosen[i]});if(!sel.length)return;
    $('#pkOk').disabled=true;$('#pkOk').textContent='Speichere …';
    var made=[],seq=Promise.resolve();
    sel.forEach(function(f){seq=seq.then(function(){
      var polys=f.polys.map(function(pl){return pl.map(cleanRing).filter(function(r){return r.length>3})}).filter(function(pl){return pl.length});
      var lot={id:uid('l'),name:f.name,ha:f.ha||null,polys:polys},tries=0;
      while(JSON.stringify(lot).length>240000&&tries++<6)lot.polys=thin(lot.polys);
      made.push(lot);return Store.put('lots',lot,true);
    })});
    seq.then(function(){
      return null;
    }).then(function(){
      closeSheet();toast(made.length+' '+(made.length===1?'Los':'Lose')+' importiert');renderAll();
      var b=[180,90,-180,-90];made.forEach(function(l){var x=bboxOf(l.polys);b=[Math.min(b[0],x[0]),Math.min(b[1],x[1]),Math.max(b[2],x[2]),Math.max(b[3],x[3])]});
      switchTab('map');fitBox(b);
    }).catch(function(e){toast('Import fehlgeschlagen ('+(e&&e.code||'Fehler')+').');renderAll()});
  };
}
function importBackup(j){
  var n=0,seq=Promise.resolve();
  ['markers','sightings','kills','lots'].forEach(function(c){(j[c]||[]).forEach(function(o){if(o&&o.id){seq=seq.then(function(){n++;return Store.put(c,o,true)})}})});
  seq.then(function(){if(j.tracks)trkMerge(j.tracks);return j.settings?Store.setting(j.settings):null}).then(function(){renderAll();toast(n+' Einträge eingelesen')}).catch(function(e){toast('Einlesen fehlgeschlagen ('+(e&&e.code||'Fehler')+').')});
}

/* ---------- boot ---------- */
renderTabs();renderHeader();renderLayers();resize();loadBase();
Store.init().catch(function(){S.mode='local';Store.loadLocal();markReady()});
trkRecover();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
try{if(!localStorage.getItem(LS+'.tip1')){localStorage.setItem(LS+'.tip1','1');setTimeout(function(){toast('Tipp: Auf der Karte lange drücken, um dort etwas einzutragen.')},2500)}}catch(e){}
})();
