<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D5A43">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Revierbuch"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Revierbuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen field app. Slim header, four views (Karte, Einträge, Statistik, Daten) and a bottom tab bar.
   The map bleeds edge to edge; every other surface keeps the side gutter. Palette is forest signage: green-tinted
   neutrals, one forest-green accent, one marker colour per facility type, red reserved for harvests. */
:root{
  --bg:#EDEFE8; --surface:#F8F9F4; --ink:#19231D; --ink-2:#55615A; --line:#CBD1C5;
  --accent:#2D5A43; --accent-ink:#FFFFFF; --map:#E3E8DC; --grid:#D3DACB; --on-mark:#FFFFFF;
  --kanzel:#2D5A43; --bock:#2F5F86; --huette:#7A5A34; --futter:#B07A1E; --kirrung:#A4502F;
  --salz:#5B6B73; --acker:#6F7A25; --sonst:#6B746E; --sicht:#6A4C93; --kill:#B3261E;
  --warn:#7A4E00; --warn-bg:#F4E5BF; --shadow:0 6px 24px rgba(20,30,24,.18);
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101612; --surface:#18211B; --ink:#E4EADF; --ink-2:#9BA89F; --line:#2E3B32;
  --accent:#7FC29A; --accent-ink:#0E1A12; --map:#0C120F; --grid:#18231C; --on-mark:#0E1A12;
  --kanzel:#7FC29A; --bock:#7FB3DB; --huette:#D2AE82; --futter:#E0AE55; --kirrung:#E58F6C;
  --salz:#9DB0BA; --acker:#BCC864; --sonst:#9AA59E; --sicht:#BDA3E6; --kill:#F2837B;
  --warn:#F0CF86; --warn-bg:#3A2F12; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#18211B; --ink:#E4EADF; --ink-2:#9BA89F; --line:#2E3B32;
  --accent:#7FC29A; --accent-ink:#0E1A12; --map:#0C120F; --grid:#18231C; --on-mark:#0E1A12;
  --kanzel:#7FC29A; --bock:#7FB3DB; --huette:#D2AE82; --futter:#E0AE55; --kirrung:#E58F6C;
  --salz:#9DB0BA; --acker:#BCC864; --sonst:#9AA59E; --sicht:#BDA3E6; --kill:#F2837B;
  --warn:#F0CF86; --warn-bg:#3A2F12; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-body);-webkit-text-size-adjust:100%;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gx{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#app{height:100%;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding-block:8px;background:var(--surface);border-bottom:1px solid var(--line);min-height:52px}
.brand{min-width:0;flex:1}
.brand h1{margin:0;font:700 22px/1 var(--font-display);letter-spacing:.09em;text-transform:uppercase}
.brand small{display:block;color:var(--ink-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.status{display:flex;gap:6px;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;background:var(--bg);color:var(--ink-2);min-height:28px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ink-2)}
.pill.ok i{background:var(--accent)} .pill.busy i{background:var(--futter)} .pill.bad i{background:var(--kill)}
button.pill{cursor:pointer}

.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
#viewMap{overflow:hidden;background:var(--map)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.pad{padding-block:16px 28px;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;min-height:56px;color:var(--ink-2);font:600 12px/1 var(--font-display);letter-spacing:.07em;text-transform:uppercase;border-top:3px solid transparent}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}

/* map overlays */
.layers{position:absolute;top:10px;left:0;right:0;display:flex;gap:6px;overflow-x:auto;padding-block:2px;scrollbar-width:none}
.layers::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;min-height:34px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.chip i{width:10px;height:10px;border-radius:3px;background:var(--c,var(--ink-2))}
.chip[aria-pressed="false"]{color:var(--ink-2);background:var(--bg)} .chip[aria-pressed="false"] i{opacity:.35}
.demo{position:absolute;top:54px;left:0;right:0;display:flex;align-items:center;gap:10px}
.demo div{flex:1;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.demo button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:4px;min-height:32px}
.maptools{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;display:flex;flex-direction:column;gap:8px}
.rb{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);padding:0}
.rb svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.rb.on svg{stroke:var(--accent)}
.fab{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:0 22px 0 16px;height:50px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);font:700 17px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase}
.fab svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.scale{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:78px;font:500 11px/1 var(--font-mono);color:var(--ink);pointer-events:none}
.scale b{display:block;height:6px;border:2px solid var(--ink);border-top:0;margin-top:3px}
.place{position:absolute;top:0;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.place p{margin:0;font-size:14px}
.place code{font:500 13px var(--font-mono);color:var(--ink-2)}

/* buttons, fields */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 16px;min-height:46px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--kill);border-color:currentColor}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font:600 13px/1 var(--font-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
input[type=text],input[type=number],input[type=search],input[type=datetime-local],select,textarea{width:100%;min-height:46px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;min-width:0}
textarea{resize:vertical}
input.mono{font-family:var(--font-mono);letter-spacing:.04em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:84px;border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:44px;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.type{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;min-height:46px;text-align:left;font-size:14px}
.type i,.mk{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--on-mark);font:700 13px/1 var(--font-display);font-style:normal}
.type[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}
.posrow{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.posrow code{font:500 14px var(--font-mono)}
.hint{font-size:13px;color:var(--ink-2);margin:0}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px}

/* sheet */
#ov{position:fixed;inset:0;background:rgba(10,16,12,.5);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:90%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding-top:8px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
#sheet:focus{outline:0}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:44px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sbody{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sbody h2{margin:0;font:700 24px/1.1 var(--font-display);letter-spacing:.05em;text-transform:uppercase}
.choice{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;min-height:64px;text-align:left;width:100%}
.choice b{display:block;font-size:16px} .choice small{color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv code{font-family:var(--font-mono)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:min(92vw,520px);text-align:center;box-shadow:var(--shadow)}

/* lists */
h2.sec{margin:0;font:700 20px/1 var(--font-display);letter-spacing:.07em;text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar .btn{flex:1}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:60px}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .rt b{overflow-wrap:anywhere}
.row small{color:var(--ink-2);font-size:13px}
.tagc{font:500 12px var(--font-mono);border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--bg);flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.mk.sq{border-radius:8px}
.empty{color:var(--ink-2);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:12px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .bt{height:14px;border-radius:4px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar .bt i{display:block;height:100%;background:var(--accent)}
.bar .bv{font:500 13px var(--font-mono);text-align:right;white-space:nowrap}
.bar .bl{overflow-wrap:anywhere}
.bar small{display:block;color:var(--ink-2);font-size:12px}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:150px;padding-top:6px}
.months div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font:500 10px var(--font-mono);color:var(--ink-2);min-width:0}
.months i{display:block;width:100%;background:var(--kill);border-radius:3px 3px 0 0;min-height:2px}
.months em{font-style:normal;color:var(--ink)}
.big{font:700 56px/1 var(--font-display);letter-spacing:.02em}
.lotrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.lotrow span{flex:1;min-width:120px;overflow-wrap:anywhere}
.pick{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px}
.pick label{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;min-height:44px}
.pick input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
a{color:var(--accent)}
.attr{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:100px;max-width:60%;font:400 10px/1.3 var(--font-body);color:var(--ink);background:color-mix(in srgb,var(--surface) 78%,transparent);padding:2px 6px;border-radius:4px;pointer-events:none}
.attr:empty{display:none}
a.btn{text-decoration:none;color:var(--ink)}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
</style>

</head>
<body>
<div id="app">
  <header class="top gx">
    <div class="brand"><h1>Revierbuch</h1><small id="lotName">Kein Los gewählt</small></div>
    <div class="status"><span class="pill" id="stStore"><i></i><span>Lade …</span></span><button class="pill" id="stGps" type="button" aria-label="Standort"><i></i><span>GPS aus</span></button></div>
  </header>
  <div class="views">
    <section class="view" id="viewMap">
      <canvas id="map" aria-label="Revierkarte"></canvas>
      <div class="layers gx" id="layers"></div>
      <div class="demo gx" id="demo" hidden><div><span>Beispieldaten sind sichtbar. Sie verschwinden mit deinem ersten Eintrag.</span><button type="button" id="demoOff">Ausblenden</button></div></div>
      <div class="attr" id="attr"></div>
      <div class="scale" id="scale"><span id="scaleL"></span><b id="scaleB"></b></div>
      <div class="maptools">
        <button class="rb" id="bFit" type="button" aria-label="Zu meinem Los"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="rb" id="bLoc" type="button" aria-label="Mein Standort"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
        <button class="rb" id="bIn" type="button" aria-label="Hineinzoomen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="rb" id="bOut" type="button" aria-label="Herauszoomen"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      </div>
      <button class="fab" id="fab" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Eintragen</button>
      <div class="place gx" id="place" hidden>
        <p><b id="placeTitle">Position wählen</b><br><span class="hint">Karte verschieben, bis das Fadenkreuz auf dem Ort liegt.</span></p>
        <code id="pcoord"></code>
        <div class="btnrow"><button class="btn primary sm" id="pOk" type="button">Hier setzen</button><button class="btn sm" id="pGps" type="button">Mein Standort</button><button class="btn sm" id="pNo" type="button">Abbrechen</button></div>
      </div>
    </section>
    <section class="view" id="viewLog" hidden><div class="pad gx" id="logBody"></div></section>
    <section class="view" id="viewStats" hidden><div class="pad gx" id="statsBody"></div></section>
    <section class="view" id="viewData" hidden><div class="pad gx" id="dataBody"></div></section>
  </div>
  <nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
</div>
<div id="ov" hidden></div>
<section id="sheet" class="gx" role="dialog" aria-modal="true" tabindex="-1" hidden><div class="grab"></div><div class="sbody" id="sheetBody"></div></section>
<div id="toast" role="status" hidden></div>
<input type="file" id="fileIn" accept=".geojson,.json,.kml,application/json,application/geo+json,application/vnd.google-earth.kml+xml" hidden>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var clone=function(o){return JSON.parse(JSON.stringify(o))};

/* ---------- constants ---------- */
var FAC={
  kanzel:{label:'Kanzel',glyph:'K',c:'--kanzel'},
  bock:{label:'Ansitzbock / Drückjagdstand',glyph:'B',c:'--bock'},
  huette:{label:'Jagdunterstand / Hütte',glyph:'H',c:'--huette'},
  futter:{label:'Futterplatz',glyph:'F',c:'--futter'},
  kirrung:{label:'Kirrung',glyph:'Ki',c:'--kirrung'},
  salz:{label:'Salzlecke',glyph:'S',c:'--salz'},
  acker:{label:'Wildacker / Äsungsfläche',glyph:'W',c:'--acker'},
  sonst:{label:'Sonstiges',glyph:'·',c:'--sonst'}
};
var SEATS=['kanzel','bock'];
var SPECIES=['Rehwild','Rotwild','Schwarzwild','Damwild','Muffelwild','Fuchs','Dachs','Marder','Marderhund','Waschbär','Wildgans','Sonstiges'];
var SEX={m:'männlich',w:'weiblich',u:'unbekannt',g:'gemischt'};
var AGE={juv:'Jungtier',ueb:'Überläufer / Jährling',ad:'Adult',u:'unbekannt'};
var MONTHS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
var ICON={
  map:'<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
  data:'<path d="M12 3c4.4 0 8 1.1 8 2.5S16.4 8 12 8 4 6.9 4 5.5 7.6 3 12 3z"/><path d="M4 5.5v6C4 12.9 7.6 14 12 14s8-1.1 8-2.5v-6M4 11.5v6C4 18.9 7.6 20 12 20s8-1.1 8-2.5v-6"/>'
};
var nf=new Intl.NumberFormat('de-LU',{maximumFractionDigits:1});
function fmtDate(iso){var d=new Date(iso);return isNaN(d)?'':d.toLocaleString('de-LU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function toLocalInput(iso){var d=iso?new Date(iso):new Date();var p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function posText(o){return o&&o.lat!=null?o.lat.toFixed(5)+'° N, '+o.lon.toFixed(5)+'° E':'noch keine Position'}

/* ---------- stats tab ---------- */
function renderStats(){
  var kills=G('kills'),sights=G('sightings'),yr=function(x){return new Date(x.ts).getFullYear()};
  var years=Array.from(new Set(kills.concat(sights).map(yr))).sort(function(a,b){return b-a});
  if(S.statYear!=='all'&&years.indexOf(+S.statYear)<0)S.statYear='all';
  var Y=S.statYear,ks=kills.filter(function(k){return Y==='all'||yr(k)===+Y}),ss=sights.filter(function(k){return Y==='all'||yr(k)===+Y});
  function group(arr,fn){var m=new Map();arr.forEach(function(x){var k=fn(x),e=m.get(k)||{n:0,w:0,wn:0};e.n++;if(x.weight!=null){e.w+=x.weight;e.wn++}m.set(k,e)});return Array.from(m).sort(function(a,b){return b[1].n-a[1].n})}
  function bars(rows,fmt){var mx=Math.max.apply(null,rows.map(function(r){return r[1].n}));return '<div class="bars">'+rows.map(function(r){return '<div class="bar"><span class="bl">'+esc(r[0])+(fmt?'<small>'+fmt(r)+'</small>':'')+'</span><span class="bt"><i style="width:'+Math.round(r[1].n/mx*100)+'%"></i></span><span class="bv">'+r[1].n+'</span></div>'}).join('')+'</div>'}
  var html='<div class="field"><span class="lbl">Zeitraum</span><select id="statYear"><option value="all">Alle Jahre</option>'+years.map(function(y){return '<option value="'+y+'"'+(String(Y)===String(y)?' selected':'')+'>'+y+'</option>'}).join('')+'</select></div>';
  if(useDemo())html+='<div class="warnbox">Das sind Beispieldaten. Sie verschwinden mit deinem ersten Eintrag.</div>';
  if(!ks.length){html+='<div class="empty">Für diesen Zeitraum gibt es noch keine Abschüsse. Trage sie unter „Einträge“ ein, dann erscheint hier die Auswertung.</div>'}
  else{
    var bySp=group(ks,function(k){return k.species}),byK=group(ks,function(k){return k.kanzelId?facName(k.kanzelId)||'Gelöschte Kanzel':'Ohne Kanzel'});
    var mc=new Array(12).fill(0);ks.forEach(function(k){mc[new Date(k.ts).getMonth()]++});var mm=Math.max.apply(null,mc);
    var sightByK={};ss.forEach(function(s){var n=s.kanzelId?facName(s.kanzelId):'Ohne Kanzel';sightByK[n]=(sightByK[n]||0)+(s.count||1)});
    html+='<div class="card"><span class="lbl">Abschüsse gesamt</span><div class="big">'+ks.length+'</div></div>'+
    '<div class="card"><h2 class="sec">Nach Wildart</h2>'+bars(bySp,function(r){return r[1].wn?'Ø '+nf.format(r[1].w/r[1].wn)+' kg aufgebrochen':''})+'</div>'+
    '<div class="card"><h2 class="sec">Nach Kanzel</h2>'+bars(byK,function(r){return (sightByK[r[0]]||0)+' Wild gesehen'})+'</div>'+
    '<div class="card"><h2 class="sec">Nach Monat</h2><div class="months">'+mc.map(function(n,i){return '<div><em>'+(n||'')+'</em><i style="height:'+Math.round(n/mm*100)+'px"></i>'+MONTHS[i]+'</div>'}).join('')+'</div></div>';
    var cnt=new Map();ss.forEach(function(s){cnt.set(s.species,(cnt.get(s.species)||0)+(s.count||1))});
    var rows=Array.from(cnt).sort(function(a,b){return b[1]-a[1]}).map(function(r){return [r[0],{n:r[1]}]});
    if(rows.length)html+='<div class="card"><h2 class="sec">Gesehenes Wild</h2>'+bars(rows)+'</div>';
  }
  html+='<p class="hint">Der Vergleich mit dem Abschussplan kommt in Version 2.</p>';
  $('#statsBody').innerHTML=html;
  $('#statYear').onchange=function(e){S.statYear=e.target.value;renderStats()};
}

  '<p class="hint">Alle Lose von Luxemburg (gültig ab 1. April 2021) sind auf der Karte sichtbar. Tippe dort auf ein Los, um es als dein Los zu markieren, oder gib die Nummer ein.</p>'+
  '<div class="btnrow"><input type="number" inputmode="numeric" id="addNo" placeholder="Losnummer" min="1" style="flex:1;min-width:120px"><button class="btn primary" id="addLot" type="button">Hinzufügen</button></div>'+
  (mineNos.length?'<div class="rows">'+mineNos.map(function(n){var b=BASE.filter(function(x){return x.no===n})[0];return '<div class="lotrow"><span><b>Los '+n+'</b>'+(b&&b.ha?' · '+nf.format(b.ha)+' ha':'')+'</span><button class="btn sm" data-fit="'+n+'" type="button">Anzeigen</button><button class="btn sm danger" data-rm="'+n+'" type="button">Entfernen</button></div>'}).join('')+'</div>':'<p class="hint">Noch kein Los markiert.</p>')+
  (lots.length?'<div class="rows">'+lots.map(function(l){return '<div class="lotrow"><span><b>'+esc(l.name)+'</b> · eigene Grenze</span><button class="btn sm" data-cfit="'+esc(l.id)+'" type="button">Anzeigen</button><button class="btn sm danger" data-cdel="'+esc(l.id)+'" type="button">Löschen</button></div>'}).join('')+'</div>':'')+
  '<div class="btnrow"><button class="btn" id="impLots" type="button">Eigene Grenzen einlesen</button></div>'+
  '<p class="hint">Quelle: <a href="https://data.public.lu/en/datasets/hunting-units/" target="_blank" rel="noopener">Lots de chasse, Administration de la nature et des forêts</a> (freie Lizenz). Für die App in WGS 84 umgerechnet und auf etwa einen Meter vereinfacht.</p></div>';
  html+='<div class="card"><h2 class="sec">Speicher und Export</h2>'+
  '<p class="hint">'+(S.mode==='cloud'?'Deine Einträge liegen privat in deinem Konto und sind auf allen deinen Geräten verfügbar.':'Deine Einträge bleiben nur in diesem Browser. Erstelle regelmäßig eine Sicherung.')+'</p>'+
  '<div class="btnrow"><button class="btn" id="expCsv" type="button"'+''+'>Abschüsse als CSV</button><button class="btn" id="expJson" type="button"'+''+'>Sicherung (JSON)</button><button class="btn" id="impJson" type="button">Sicherung einlesen</button></div>'+
  '</div>';
  html+='<div class="card"><h2 class="sec">Beispieldaten</h2><p class="hint">Solange noch nichts eingetragen ist, zeigt die App Beispieldaten.</p><div class="btnrow"><button class="btn" id="exTog" type="button">'+(D.settings.hideExamples?'Beispieldaten wieder einblenden':'Beispieldaten ausblenden')+'</button></div></div>';
  html+=srcCardHtml();
  $('#dataBody').innerHTML=html;
  $('#impLots').onclick=function(){fileMode='lots';$('#fileIn').click()};
  $('#impJson').onclick=function(){fileMode='backup';$('#fileIn').click()};
  $('#exTog').onclick=function(){guard(Store.setting({hideExamples:!D.settings.hideExamples}))};
  var c=$('#expCsv');if(c)c.onclick=exportCsv;var j=$('#expJson');if(j)j.onclick=exportJson;bindSources();
  var add=$('#addLot');if(add)add.onclick=function(){
    var n=parseInt($('#addNo').value,10);
    if(!BASE.length){toast('Die Lose sind noch nicht geladen.');return}
    var l=BASE.filter(function(x){return x.no===n})[0];if(!l){toast('Ein Los mit dieser Nummer gibt es nicht.');return}
    var arr=(D.settings.myLots||[]).slice();if(arr.indexOf(n)<0)arr.push(n);
    guard(Store.setting({myLots:arr})).then(function(){toast('Los '+n+' hinzugefügt');switchTab('map');fitBox(l.bb)},function(){});
  };
  $$('#dataBody [data-fit]').forEach(function(b){b.onclick=function(){var n=+b.dataset.fit,l=BASE.filter(function(x){return x.no===n})[0];if(l){switchTab('map');fitBox(l.bb)}}});
  $$('#dataBody [data-rm]').forEach(function(b){b.onclick=function(){var n=+b.dataset.rm;guard(Store.setting({myLots:(D.settings.myLots||[]).filter(function(x){return x!==n})}))}});
  $$('#dataBody [data-cfit]').forEach(function(b){b.onclick=function(){var l=D.lots.filter(function(x){return x.id===b.dataset.cfit})[0];if(l){switchTab('map');fitBox(l.bb)}}});
  $$('#dataBody [data-cdel]').forEach(function(b){b.onclick=function(){if(b.dataset.s!=='1'){b.dataset.s='1';b.textContent='Sicher?';return}guard(Store.del('lots',b.dataset.cdel),'Löschen fehlgeschlagen')}});
}
function today(){return toLocalInput().slice(0,10)}
function exportJson(){
  var data=JSON.stringify({app:'revierbuch',version:1,exported:new Date().toISOString(),markers:D.markers,sightings:D.sightings,kills:D.kills,lots:D.lots.map(plain),settings:D.settings},null,1);
  saveFile({filename:'revierbuch-sicherung-'+today()+'.json',data:data}).then(function(){toast('Sicherung gespeichert')}).catch(function(e){if(!e||e.code!=='declined')toast('Speichern nicht möglich ('+(e&&e.code||'Fehler')+').')});
}
function exportCsv(){
  var q=function(v){v=String(v==null?'':v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var rows=[['Datum','Uhrzeit','Wildart','Geschlecht','Altersklasse','Gewicht kg','Wildmarke','Kanzel','Breite','Länge','Notiz']];
  D.kills.slice().sort(function(a,b){return new Date(a.ts)-new Date(b.ts)}).forEach(function(k){var d=new Date(k.ts);rows.push([d.toLocaleDateString('de-LU'),d.toLocaleTimeString('de-LU',{hour:'2-digit',minute:'2-digit'}),k.species,SEX[k.sex],AGE[k.age],k.weight==null?'':String(k.weight).replace('.',','),k.tag,facName(k.kanzelId),k.lat.toFixed(6),k.lon.toFixed(6),k.note])});
  if(rows.length===1){toast('Es gibt noch keine eigenen Abschüsse zum Exportieren.');return}
  saveFile({filename:'abschuesse-'+today()+'.csv',data:'﻿'+rows.map(function(r){return r.map(q).join(';')}).join('\r\n')}).then(function(){toast('CSV gespeichert')}).catch(function(e){if(!e||e.code!=='declined')toast('Speichern nicht möglich ('+(e&&e.code||'Fehler')+').')});
}

/* ---------- import ---------- */
var fileMode='lots';
$('#fileIn').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  var r=new FileReader();r.onload=function(){try{handleFile(f.name,String(r.result))}catch(err){toast(err.message||'Datei konnte nicht gelesen werden.')}};r.onerror=function(){toast('Datei konnte nicht gelesen werden.')};r.readAsText(f);
});
function handleFile(name,text){
  var t=text.replace(/^﻿/,'').trim(),feats;
  if(/\.kml$/i.test(name)||t.charAt(0)==='<'){feats=parseKml(t)}
  else{
    var j=JSON.parse(t);
    if(j&&(j.app==='revierbuch'||(j.kills&&j.markers)))return importBackup(j);
    feats=parseGeoJson(j);
  }
  if(!feats.length)throw new Error('Keine Flächen (Polygone) in der Datei gefunden.');
  pickLots(feats);
}
function lotName(p,i){
  p=p||{};var keys=['name','Name','NAME','lot','LOT','Lot','nom','NOM','bezeichnung','BEZEICHNUNG','lot_name','LOT_NAME','lot_nom','LOT_NOM','numero','NUMERO','nr','NR','id','ID'];
  var nl=['NoLot','NOLOT','nolot','No_Lot','NO_LOT','Lot_No','LotNr'];
  for(var n=0;n<nl.length;n++){if(p[nl[n]]!=null&&String(p[nl[n]]).trim()!=='')return 'Los '+String(p[nl[n]]).trim()}
  for(var k=0;k<keys.length;k++){if(p[keys[k]]!=null&&String(p[keys[k]]).trim()!=='')return String(p[keys[k]]).trim()}
  var any=Object.keys(p).filter(function(k){return typeof p[k]==='string'&&p[k].trim()&&p[k].length<60&&!/label|valable/i.test(k)})[0];
  return any?String(p[any]).trim():'Los '+(i+1);
}
function parseGeoJson(j){
  var feats=[];
  if(j.type==='FeatureCollection')feats=j.features||[];else if(j.type==='Feature')feats=[j];else if(j.coordinates)feats=[{type:'Feature',properties:{},geometry:j}];
  var crs=(j.crs&&j.crs.properties&&j.crs.properties.name)||'',out=[],mode=null;
  feats.forEach(function(ft,i){
    var g=ft.geometry;if(!g)return;var polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];
    if(!polys.length)return;
    if(!mode){var s=polys[0][0][0];mode=/3857|900913/.test(crs)?'merc':(Math.abs(s[0])<=180&&Math.abs(s[1])<=90)?'wgs':(Math.abs(s[0])<2.1e7&&s[0]>4e5&&s[0]<9e5&&s[1]>6.1e6&&s[1]<6.6e6)?'merc':'bad'}
    if(mode==='bad')throw new Error('Das Koordinatensystem passt nicht. Exportiere die Datei in QGIS als GeoJSON mit EPSG:4326 (WGS 84).');
    out.push({name:lotName(ft.properties,i),ha:(ft.properties&&ft.properties.Flaeche_ha)||null,polys:polys.map(function(pl){return pl.map(function(ring){return ring.map(function(p){return mode==='merc'?[p[0]/6378137*180/Math.PI,(2*Math.atan(Math.exp(p[1]/6378137))-Math.PI/2)*180/Math.PI]:[p[0],p[1]]})})})});
  });
  return out;
}
function parseKml(t){
  var doc=new DOMParser().parseFromString(t,'text/xml'),out=[];
  $$('Placemark',doc).forEach(function(pm,i){
    var nm=pm.getElementsByTagName('name')[0],polys=[];
    Array.prototype.forEach.call(pm.getElementsByTagName('Polygon'),function(pg){
      var rings=[];Array.prototype.forEach.call(pg.getElementsByTagName('coordinates'),function(c){
        var ring=c.textContent.trim().split(/\s+/).map(function(s){var a=s.split(',').map(parseFloat);return [a[0],a[1]]}).filter(function(a){return isFinite(a[0])&&isFinite(a[1])});
        if(ring.length>3)rings.push(ring)});
      if(rings.length)polys.push(rings);
    });
    if(polys.length)out.push({name:nm&&nm.textContent.trim()||'Los '+(i+1),polys:polys});
  });
  return out;
}
function cleanRing(r){var o=[],last=null;r.forEach(function(p){var q=[Math.round(p[0]*1e5)/1e5,Math.round(p[1]*1e5)/1e5];if(!last||last[0]!==q[0]||last[1]!==q[1]){o.push(q);last=q}});if(o.length&&(o[0][0]!==o[o.length-1][0]||o[0][1]!==o[o.length-1][1]))o.push(o[0].slice());return o}
function thin(polys){return polys.map(function(pl){return pl.map(function(r){if(r.length<12)return r;var o=r.filter(function(p,i){return i===0||i===r.length-1||i%2===0});return o})})}
function pickLots(feats){
  feats.sort(function(a,b){return a.name.localeCompare(b.name,'de',{numeric:true})});
  var pre=feats.length<=5;
  var html='<h2>Lose auswählen</h2><p class="hint">'+feats.length+' Flächen in der Datei. Wähle dein Los und bei Bedarf die Nachbarlose.</p>'+
    (feats.length>5?'<input type="search" id="pkQ" placeholder="Nach Name oder Nummer suchen" autocomplete="off">':'')+'<div class="pick" id="pkList"></div><div class="btnrow"><button class="btn primary" id="pkOk" type="button" style="flex:2">Importieren</button><button class="btn" id="pkNo" type="button" style="flex:1">Abbrechen</button></div>';
  openSheet(html);
  var chosen={};if(pre)feats.forEach(function(f,i){chosen[i]=true});
  function list(){
    var q=($('#pkQ')?$('#pkQ').value:'').trim().toLowerCase(),n=0,h='';
    feats.forEach(function(f,i){if(n>=150)return;if(q&&f.name.toLowerCase().indexOf(q)<0)return;n++;h+='<label><input type="checkbox" data-i="'+i+'"'+(chosen[i]?' checked':'')+'><span>'+esc(f.name)+(f.ha?' · '+nf.format(f.ha)+' ha':'')+'</span></label>'});
    $('#pkList').innerHTML=h||'<p class="hint" style="padding:8px">Nichts gefunden.</p>';
    $$('#pkList input').forEach(function(c){c.onchange=function(){chosen[c.dataset.i]=c.checked;cnt()}});cnt();
  }
  function cnt(){var n=Object.keys(chosen).filter(function(k){return chosen[k]}).length;$('#pkOk').textContent='Importieren ('+n+')';$('#pkOk').disabled=!n}
  if($('#pkQ'))$('#pkQ').oninput=list;list();
  $('#pkNo').onclick=closeSheet;
  $('#pkOk').onclick=function(){
    var sel=feats.filter(function(f,i){return chosen[i]});if(!sel.length)return;
    $('#pkOk').disabled=true;$('#pkOk').textContent='Speichere …';
    var made=[],seq=Promise.resolve();
    sel.forEach(function(f){seq=seq.then(function(){
      var polys=f.polys.map(function(pl){return pl.map(cleanRing).filter(function(r){return r.length>3})}).filter(function(pl){return pl.length});
      var lot={id:uid('l'),name:f.name,ha:f.ha||null,polys:polys},tries=0;
      while(JSON.stringify(lot).length>240000&&tries++<6)lot.polys=thin(lot.polys);
      made.push(lot);return Store.put('lots',lot,true);
    })});
    seq.then(function(){
      return null;
    }).then(function(){
      closeSheet();toast(made.length+' '+(made.length===1?'Los':'Lose')+' importiert');renderAll();
      var b=[180,90,-180,-90];made.forEach(function(l){var x=bboxOf(l.polys);b=[Math.min(b[0],x[0]),Math.min(b[1],x[1]),Math.max(b[2],x[2]),Math.max(b[3],x[3])]});
      switchTab('map');fitBox(b);
    }).catch(function(e){toast('Import fehlgeschlagen ('+(e&&e.code||'Fehler')+').');renderAll()});
  };
}
function importBackup(j){
  var n=0,seq=Promise.resolve();
  ['markers','sightings','kills','lots'].forEach(function(c){(j[c]||[]).forEach(function(o){if(o&&o.id){seq=seq.then(function(){n++;return Store.put(c,o,true)})}})});
  seq.then(function(){return j.settings?Store.setting(j.settings):null}).then(function(){renderAll();toast(n+' Einträge eingelesen')}).catch(function(e){toast('Einlesen fehlgeschlagen ('+(e&&e.code||'Fehler')+').')});
}

/* ---------- boot ---------- */
renderTabs();renderHeader();renderLayers();resize();loadBase();
Store.init().catch(function(){S.mode='local';Store.loadLocal();markReady()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
})();
</script>
